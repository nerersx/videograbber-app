<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VideoGrabber Cinema v4.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Библиотека HLS.js для твоего собственного видеоплеера -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #1a2540;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --amber: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      padding-bottom: 86px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand-left { display: flex; align-items: center; gap: 10px; }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.35);
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--amber); display: inline-block;
    }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .key-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .settings-box {
      display: none;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      gap: 8px;
    }
    .settings-box.open { display: flex; }
    .settings-box label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .settings-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .settings-box button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .status-msg {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 24px 10px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 860px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .movie-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rate-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .card-info { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 11px; color: var(--text-muted); }

    /* Горизонтальные полки рекомендаций */
    .shelf-block { margin-bottom: 20px; }
    .shelf-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #e2e8f0;
    }
    .shelf-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .shelf-row::-webkit-scrollbar { display: none; }
    .shelf-row .movie-card { min-width: 135px; max-width: 135px; flex-shrink: 0; }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Модалка */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-sheet {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      max-height: 93vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-header { display: flex; gap: 12px; }
    .modal-poster {
      width: 78px;
      aspect-ratio: 2/3;
      border-radius: 8px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }
    .modal-titles { flex: 1; }
    .modal-titles h2 { font-size: 15.5px; margin-bottom: 3px; }
    .modal-titles p { font-size: 11.5px; color: var(--text-muted); line-height: 1.35; }

    .mode-switch {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-hover);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.35);
    }

    /* Мульти-плеер (Кастомный HLS <video> + Iframe балансеров) */
    .player-section { display: none; flex-direction: column; gap: 8px; }
    .player-section.active { display: flex; }
    .player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .player-wrap iframe, .player-wrap video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .control-row { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    .control-row label { color: var(--text-muted); font-weight: 600; }
    .select-wrap { display: flex; gap: 6px; }
    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
    }

    .serial-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
    }
    .serial-box.active { display: flex; }
    .dl-scope-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .scope-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .scope-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      max-height: 115px;
      overflow-y: auto;
    }
    .ep-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .ep-chip.selected {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 800;
    }

    .action-btn {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .close-btn {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 4px;
      cursor: pointer;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .task-title { font-size: 13px; font-weight: 700; }
    .task-ctrl-btns { display: flex; gap: 5px; }
    .mini-ctrl {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .task-bar {
      width: 100%; height: 6px; background: var(--bg);
      border-radius: 4px; overflow: hidden; margin-top: 6px;
    }
    .task-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.4s;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(19, 27, 46, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px 12px;
      z-index: 90;
    }
    .nav-item {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 11px; font-weight: 600; display: flex; flex-direction: column;
      align-items: center; gap: 3px; cursor: pointer;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 17px; }
  </style>
</head>
<body>

  <header>
    <div class="brand-left">
      <div class="logo-badge">▶ VideoGrabber</div>
      <span style="font-size: 13px; font-weight: 700;">Cinema v4.0</span>
      <span class="conn-dot" id="srv-dot" title="Статус прямой связи с ПК"></span>
    </div>
    <button class="key-btn" id="toggle-settings-btn">⚙️ Настройки</button>
  </header>

  <div class="settings-box" id="settings-box">
    <label>🌐 Адрес сервера ПК (локальный или Cloudflare HTTPS-туннель):</label>
    <input type="text" id="srv-url-input" placeholder="http://127.0.0.1:8765">
    <label>👤 Твой Telegram ID (для дублирования в ЛС из браузера):</label>
    <input type="text" id="tg-uid-input" placeholder="Напиши /start боту или укажи ID">
    <label>🔑 API-ключ Кинопоиска:</label>
    <input type="text" id="kp-key-input" placeholder="По умолчанию встроен">
    <button id="save-settings-btn">Сохранить</button>
  </div>

  <!-- ВКЛАДКА 1: Поиск -->
  <div class="tab-pane active" id="pane-search">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск фильма или сериала (Звёздные войны, Дюна, Пацаны)...">
    </div>
    <div id="status" class="status-msg">Загрузка каталога...</div>
    <div class="grid" id="movies-grid"></div>
  </div>

  <!-- ВКЛАДКА 2: Умные рекомендации -->
  <div class="tab-pane" id="pane-recs">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:12px; color:var(--text-muted);" id="taste-profile-label">Обучаемые полки рекомендаций</span>
      <button class="key-btn" id="reset-taste-btn">Сбросить вкус</button>
    </div>
    <div id="recs-shelves"></div>
  </div>

  <!-- ВКЛАДКА 3: Списки -->
  <div class="tab-pane" id="pane-lists">
    <div class="chips-row" style="margin-bottom:12px;">
      <button class="chip active" id="btn-show-watchlist">🔖 Хочу посмотреть (<span id="cnt-watch">0</span>)</button>
      <button class="chip" id="btn-show-watched">👁 Просмотрено (<span id="cnt-watched">0</span>)</button>
    </div>
    <div id="lists-empty" class="status-msg">Список пуст.</div>
    <div class="grid" id="lists-grid"></div>
  </div>

  <!-- ВКЛАДКА 4: Трекер закачек -->
  <div class="tab-pane" id="pane-tracker">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:13px; font-weight:700;">📡 Очередь закачек на ПК и в ТГК</span>
      <button class="key-btn" id="clear-tasks-btn">Очистить</button>
    </div>
    <div id="tasks-container"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО КАРТОЧКИ ФИЛЬМА / СЕРИАЛА -->
  <div class="modal-overlay" id="modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <img src="" id="m-poster" class="modal-poster">
        <div class="modal-titles">
          <h2 id="m-title">Название</h2>
          <p id="m-dir">Жанр / Режиссёр</p>
          <p id="m-rates" style="color: #fbbf24; font-weight:600; margin-top:3px;">★ Рейтинг</p>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="key-btn" id="m-add-watch" style="flex:1;">🔖 В список</button>
            <button class="key-btn" id="m-add-watched" style="flex:1;">👁 Смотрел</button>
          </div>
        </div>
      </div>

      <div class="mode-switch">
        <button class="mode-btn active" id="tab-mode-dl">🚀 Скачать в ТГК (Топ качество)</button>
        <button class="mode-btn" id="tab-mode-watch">▶️ Смотреть онлайн</button>
      </div>

      <!-- Секция мульти-плеера (Свой HLS плеер + выбор балансеров) -->
      <div class="player-section" id="player-section">
        <div class="chips-row" id="balancer-tabs"></div>
        <div class="player-wrap">
          <video id="custom-hls-video" controls playsinline style="display:none;"></video>
          <iframe id="balancer-iframe" src="" allowfullscreen allow="autoplay *; fullscreen *"></iframe>
        </div>
      </div>

      <!-- Единый нормализованный список озвучек со всех балансеров -->
      <div class="control-row">
        <label id="voice-status-lbl">🎙 Доступные озвучки (ранжирование по 1080p):</label>
        <select id="m-voice"></select>
      </div>

      <!-- Выбор сезонов и серий для сериалов -->
      <div class="serial-box" id="serial-box">
        <div class="control-row">
          <label>📺 Сезон:</label>
          <select id="m-season"></select>
        </div>

        <div class="control-row" id="dl-scope-wrap">
          <label>📦 Режим скачивания сериала:</label>
          <div class="dl-scope-btns">
            <button class="scope-btn active" data-scope="selected">Выбрать серии</button>
            <button class="scope-btn" data-scope="season">Весь сезон</button>
            <button class="scope-btn" data-scope="all_seasons">Весь сериал</button>
          </div>
        </div>

        <div class="control-row" id="ep-picker-wrap">
          <label>Серии:</label>
          <div class="ep-grid" id="ep-grid"></div>
        </div>
      </div>

      <!-- Настройки скачивания (По умолчанию 1080p!) -->
      <div id="dl-options-wrap" style="display:flex; flex-direction:column; gap:8px;">
        <div class="control-row">
          <label>⚙️ Приоритет качества и формат:</label>
          <div class="select-wrap">
            <select id="m-quality">
              <option value="1080" selected>🔥 1080p (Full HD — Максимальное)</option>
              <option value="720">720p (HD Баланс)</option>
              <option value="480">480p (Компактный)</option>
            </select>
            <select id="m-format">
              <option value="mp4" selected>MP4 (Стриминг iOS/Android)</option>
              <option value="mkv">MKV</option>
            </select>
          </div>
        </div>
        <button class="action-btn" id="send-task-btn">🚀 Скачать в ТГК + продублировать в ЛС</button>
      </div>

      <div class="close-btn" id="close-modal-btn">Закрыть окно</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-pane="pane-search"><span class="nav-icon">🔍</span><span>Поиск</span></button>
    <button class="nav-item" data-pane="pane-recs"><span class="nav-icon">✨</span><span>Для тебя</span></button>
    <button class="nav-item" data-pane="pane-lists"><span class="nav-icon">📌</span><span>Списки</span></button>
    <button class="nav-item" data-pane="pane-tracker"><span class="nav-icon">📊</span><span>Загрузки</span></button>
  </nav>

      { canon: "🎙 АниЛибрия (AniLibria)", keys: ["anilibria", "анилибрия"] },
      { canon: "🎙 Студийная Банда", keys: ["студийная банда", "studio band"] },
      { canon: "🎙 Авторский (Гоблин / Гаврилов)", keys: ["гоблин", "пучков", "гаврилов", "михалев", "володарский", "авторский"] },
      { canon: "🎙 Многоголосый закадровый", keys: ["многоголос", "мво", "mvo", "профессиональн", "novamedia", "amedia"] },
      { canon: "🇬🇧 Оригинал (Original + Sub)", keys: ["оригинал", "original", "eng", "английск", "субтитр", "sub"] }
    ];

    function normalizeVoiceTitle(raw) {
      if (!raw) return "🎬 Дубляж (Официальный)";
      const low = raw.toLowerCase().trim();
      for (const rule of VOICE_SYNONYM_MAP) {
        if (rule.keys.some(k => low.includes(k))) return rule.canon;
      }
      const clean = raw.replace(/\[.*?\]|\(.*?\)/g, '').trim();
      return clean ? `🎙 ${clean}` : "🎬 Дубляж (Официальный)";
    }

    function getQualityScore(qStr) {
      const s = String(qStr || '').toLowerCase();
      if (s.includes('2160') || s.includes('4k')) return 2160;
      if (s.includes('1080') || s.includes('fhd') || s.includes('bd')) return 1080;
      if (s.includes('720') || s.includes('hd')) return 720;
      return 720;
    }

    // === 2. ФИЛЬТР ПОСТЕРОВ И ПОИСК КАТАЛОГА ===
    function isBadPosterUrl(url) {
      if (!url || typeof url !== 'string') return true;
      const low = url.toLowerCase();
      return low.includes('no-poster') || low.includes('noposter') || low.includes('empty') || low.includes('placeholder');
    }

    async function resolveMissingPoster(title, origTitle, year, imgEl) {
      for (const qText of [origTitle, title].filter(Boolean)) {
        try {
          const q = `${qText} ${year || ''}`.trim();
          const res = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(q)}`);
          if (res.ok) {
            const data = await res.json();
            const found = (data.description || []).find(item => item['#IMG_POSTER'] && !isBadPosterUrl(item['#IMG_POSTER']));
            if (found) {
              imgEl.src = found['#IMG_POSTER'];
              return found['#IMG_POSTER'];
            }
          }
        } catch (e) {}
      }
      return null;
    }

    async function fetchMoviesByQuery(query) {
      const results = [];
      const seen = new Set();

      if (kpApiKey) {
        try {
          const url = query
            ? `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}`
            : `https://kinopoiskapiunofficial.tech/api/v2.2/films/collections?type=TOP_POPULAR_ALL&page=1`;
          const res = await fetch(url, { headers: { 'X-API-KEY': kpApiKey, 'Content-Type': 'application/json' } });
          if (res.ok) {
            const data = await res.json();
            (data.films || data.items || []).forEach(f => {
              const title = f.nameRu || f.nameEn || f.nameOriginal || '';
              if (!title) return;
              const year = String(f.year || '');
              const key = `${title}_${year}`.toLowerCase();
              if (seen.has(key)) return;
              seen.add(key);

              const rawPoster = f.posterUrlPreview || f.posterUrl || '';
              const genres = (f.genres || []).map(g => g.genre).slice(0, 2);
              results.push({
                id: String(f.filmId || f.kinopoiskId || ''),
                kp_id: String(f.filmId || f.kinopoiskId || ''),
                imdb_id: String(f.imdbId || ''),
                title: title,
                orig_title: f.nameEn || f.nameOriginal || title,
                year: year,
                poster: isBadPosterUrl(rawPoster) ? '' : rawPoster,
                rating: (f.rating && f.rating !== 'null') ? f.rating : (f.ratingKinopoisk || 'HD'),
                genres: genres,
                director: genres.join(', ') || 'Кино и сериалы',
                overview: f.description || ''
              });
            });
          }
        } catch (e) {}
      }

      if (results.length < 5 && query) {
        try {
          const imdbRes = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(query)}`);
          if (imdbRes.ok) {
            const imdbData = await imdbRes.json();
            (imdbData.description || []).slice(0, 10).forEach(item => {
              const title = item['#TITLE'] || '';
              const year = String(item['#YEAR'] || '');
              const key = `${title}_${year}`.toLowerCase();
              if (title && !seen.has(key)) {
                seen.add(key);
                results.push({
                  id: item['#IMDB_ID'] || title,
                  kp_id: '',
                  imdb_id: item['#IMDB_ID'] || '',
                  title: title,
                  orig_title: title,
                  year: year,
                  poster: item['#IMG_POSTER'] || '',
                  rating: 'IMDb',
                  genres: [],
                  director: item['#ACTORS'] || 'IMDb Global',
                  overview: `В ролях: ${item['#ACTORS'] || '—'}`
                });
              }
            });
          }
        } catch (e) {}
      }
      return results;
    }

    async function searchMovies(query) {
      const statusEl = document.getElementById('status');
      const grid = document.getElementById('movies-grid');
      statusEl.style.display = 'block';
      statusEl.textContent = query ? `Ищем «${query}»...` : 'Загрузка популярных новинок...';

      const list = await fetchMoviesByQuery(query);
      if (!list.length) {
        grid.innerHTML = '';
        statusEl.textContent = 'Ничего не найдено.';
      } else {
        statusEl.style.display = 'none';
        renderMoviesToGrid(list, grid);
      }

    function renderMoviesToGrid(movies, targetEl) {
      targetEl.innerHTML = '';
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        const fallbackSvg = `https://placehold.co/300x450/131b2e/38bdf8?text=${encodeURIComponent(m.title.slice(0, 16))}`;
        const validPoster = (!isBadPosterUrl(m.poster)) ? m.poster : '';

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${validPoster || fallbackSvg}" loading="lazy" alt="${m.title}">
            <span class="rate-badge">★ ${m.rating || 'HD'}</span>
          </div>
          <div class="card-info">
            <span class="card-title">${m.title}</span>
            <span class="card-meta">${m.year ? m.year + ' г.' : 'Фильм'}</span>
          </div>
        `;

        const imgEl = card.querySelector('img');
        if (!validPoster) {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => { if (u) m.poster = u; });
        }
        imgEl.addEventListener('error', () => {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => {
            if (!u) imgEl.src = fallbackSvg;
          });
        }, { once: true });

        card.addEventListener('click', () => openMovieDetail(m));
        targetEl.appendChild(card);
      });
    }

    // === 3. МУЛЬТИ-СКАНЕР ОЗВУЧЕК И БАЛАНСЕРОВ (БЕЗ БЛОКИРОВОК CORS) ===
    async function fetchAllBalancerSources(m) {
      const rawSources = [];
      const cleanTitle = m.title.replace(/\(\d{4}\)/g, '').replace(/[:\-–]/g, ' ').trim();

      // А. Пробуем запросить через наш Python-сервер (если он на связи)
      try {
        const params = new URLSearchParams({
          title: cleanTitle,
          orig_title: m.orig_title || '',
          year: m.year || '',
          kp_id: m.kp_id || '',
          imdb_id: m.imdb_id || ''
        });
        const srvRes = await fetch(`${serverUrl}/api/sources?${params.toString()}`, { signal: AbortSignal.timeout(3000) });
        if (srvRes.ok) {
          const srvData = await srvRes.json();
          if (srvData.results && srvData.results.length > 0) {
            return srvData.results;
          }
        }
      } catch (e) {}

      // Б. Параллельный опрос из браузера: Kinobox Multi-API + Kodik (прямой и через CORS-прокси)
      const fetchWithCorsFallback = async (targetUrl) => {
        try {
          const r = await fetch(targetUrl, { signal: AbortSignal.timeout(3500) });
          if (r.ok) return await r.json();
        } catch (e) {}
        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const pr = await fetch(proxyUrl, { signal: AbortSignal.timeout(4500) });
          if (pr.ok) return await pr.json();
        } catch (e) {}
        return null;
      };

      // 1. Опрос Kodik
      const kodikUrls = [];
      if (m.kp_id && /^\d+$/.test(m.kp_id)) {
        kodikUrls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&kinopoisk_id=${m.kp_id}&with_episodes=true`);
      }
      kodikUrls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&title=${encodeURIComponent(cleanTitle)}&with_episodes=true`);
      if (m.orig_title && m.orig_title !== cleanTitle) {
        kodikUrls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&title=${encodeURIComponent(m.orig_title)}&with_episodes=true`);
      }

      for (const u of kodikUrls) {
        const data = await fetchWithCorsFallback(u);
        if (data && data.results && data.results.length > 0) {
          data.results.forEach(item => {
            const rawV = item.translation?.title || 'Оригинал / Дубляж';
            const qScore = getQualityScore(item.quality || '1080p');
            let link = item.link || '';
            if (link.startsWith('//')) link = 'https:' + link;
            rawSources.push({
              balancer: 'Kodik',
              voice_canonical: normalizeVoiceTitle(rawV),
              voice_raw: rawV,
              quality: qScore >= 1080 ? '1080p' : `${qScore}p`,
              quality_rank: qScore,
              iframe_url: link,
              is_serial: Boolean(item.seasons),
              seasons: item.seasons || {}
            });
          });
          break;
        }
      }

      // 2. Опрос агрегатора Kinobox (Alloha, Collaps, Videocdn, Voidboost)
      if (m.kp_id && /^\d+$/.test(m.kp_id)) {
        const kbData = await fetchWithCorsFallback(`https://api.kinobox.tv/api/players?kinopoisk=${m.kp_id}`);
        const players = Array.isArray(kbData) ? kbData : (kbData?.data || []);
        players.forEach(p => {
          const bName = (p.type || p.source || 'Alloha').toUpperCase();
          const iframe = p.iframeUrl || p.url || '';
          if (!iframe || bName === 'KODIK') return;
          const trList = p.translations || [{ name: 'Дубляж (Официальный)', quality: '1080p' }];
          trList.forEach(tr => {
            const rV = tr.name || tr.title || 'Дубляж';
            const qS = getQualityScore(tr.quality || p.quality || '1080p');
            rawSources.push({
              balancer: bName,
              voice_canonical: normalizeVoiceTitle(rV),
              voice_raw: rV,
              quality: qS >= 1080 ? '1080p' : `${qS}p`,
              quality_rank: qS,
              iframe_url: iframe,
              is_serial: false,
              seasons: {}
            });
          });
        });
      }

      // 3. Международный балансер VidSrc 1080p
      if (m.imdb_id || m.kp_id) {
        const vidUrl = m.imdb_id
          ? `https://vidsrc.xyz/embed/movie/${m.imdb_id}`
          : `https://ddbb.lol/?kp=${m.kp_id}`;
        rawSources.push({
          balancer: 'MultiPlayer 1080p',
          voice_canonical: '🎬 Дубляж (Официальный)',
          voice_raw: 'Мульти-балансер HD',
          quality: '1080p',
          quality_rank: 1080,
          iframe_url: vidUrl,
          is_serial: false,
          seasons: {}
        });
      }

      // Сортируем: сначала максимальное качество (1080p)
      rawSources.sort((a, b) => b.quality_rank - a.quality_rank);
      return rawSources;
    }

    // Группировка одинаковых озвучек из разных плееров в единый список
    function groupAndRankVoices(sources) {
      const map = new Map();
      sources.forEach(src => {
        const key = src.voice_canonical;
        if (!map.has(key)) {
          map.set(key, {
            canonical: key,
            bestQuality: src.quality,
            bestRank: src.quality_rank,
            balancers: [src.balancer],
            primarySource: src,
            allSources: [src]
          });
        } else {
          const grp = map.get(key);
          grp.allSources.push(src);
          if (!grp.balancers.includes(src.balancer)) grp.balancers.push(src.balancer);
          if (src.quality_rank > grp.bestRank || (src.seasons && Object.keys(src.seasons).length > 0 && !grp.primarySource.is_serial)) {
            grp.bestRank = src.quality_rank;
            grp.bestQuality = src.quality;
            grp.primarySource = src;
          }
        }
      });
      return Array.from(map.values()).sort((a, b) => b.bestRank - a.bestRank);
    }

    // === 4. ОТКРЫТИЕ МОДАЛКИ, КАСТОМНЫЙ HLS-ПЛЕЕР И ВЫБОР СЕРИЙ ===
    async function openMovieDetail(m) {
      selectedMovie = m;
      recordUserInterest(m, 1);

      const fallbackSvg = `https://placehold.co/300x450/131b2e/38bdf8?text=${encodeURIComponent(m.title.slice(0, 16))}`;
      document.getElementById('m-poster').src = m.poster || fallbackSvg;
      document.getElementById('m-title').textContent = `${m.title} ${m.year ? '(' + m.year + ')' : ''}`;
      document.getElementById('m-dir').textContent = m.director || 'Фильм / Сериал';
      document.getElementById('m-rates').textContent = `★ ${m.rating}`;

      setModalMode(false);
      document.getElementById('modal').style.display = 'flex';

      const voiceSelect = document.getElementById('m-voice');
      const voiceLbl = document.getElementById('voice-status-lbl');
      voiceLbl.textContent = '⏳ Опрашиваем Kodik, Alloha, Collaps и Videocdn...';
      voiceSelect.innerHTML = `<option value="Любая">Поиск лучших потоков 1080p...</option>`;

      const allSources = await fetchAllBalancerSources(m);
      unifiedVoiceGroups = groupAndRankVoices(allSources);

      if (unifiedVoiceGroups.length === 0) {
        voiceLbl.textContent = '⚡ Автоматический подбор дорожки на сервере:';
        voiceSelect.innerHTML = `<option value="🎬 Дубляж (Официальный)">🎬 Дубляж (Автопоиск 1080p)</option>`;
        return;
      }

      voiceLbl.textContent = `🎙 Объединенный список озвучек (${unifiedVoiceGroups.length}):`;
      voiceSelect.innerHTML = unifiedVoiceGroups.map((g, i) =>
        `<option value="${g.canonical}" data-idx="${i}">${g.canonical} — 🔥 ${g.bestQuality} [${g.balancers.join(' / ')}]</option>`
      ).join('');

      currentVoiceGroup = unifiedVoiceGroups[0];
      voiceSelect.onchange = () => {
        const idx = voiceSelect.selectedIndex;
        currentVoiceGroup = unifiedVoiceGroups[idx] || unifiedVoiceGroups[0];
        renderSeasonsAndEpisodes(currentVoiceGroup.primarySource);
        if (isWatchOnlineMode) renderBalancerTabsAndPlay();
      };

      renderSeasonsAndEpisodes(currentVoiceGroup.primarySource);
    }

    function setModalMode(watchOnline) {
      isWatchOnlineMode = watchOnline;
      document.getElementById('tab-mode-watch').classList.toggle('active', watchOnline);
      document.getElementById('tab-mode-dl').classList.toggle('active', !watchOnline);
      document.getElementById('player-section').classList.toggle('active', watchOnline);
      document.getElementById('dl-options-wrap').style.display = watchOnline ? 'none' : 'flex';
      document.getElementById('dl-scope-wrap').style.display = watchOnline ? 'none' : 'flex';

      if (watchOnline) {
        recordUserInterest(selectedMovie, 3);
        renderBalancerTabsAndPlay();
      } else {
        stopActivePlayers();
      }
    }

    function stopActivePlayers() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      const vid = document.getElementById('custom-hls-video');
      vid.pause();
      vid.removeAttribute('src');
      vid.style.display = 'none';
      const ifr = document.getElementById('balancer-iframe');
      ifr.src = '';
      ifr.style.display = 'block';
    }

    function renderBalancerTabsAndPlay() {
      const tabsEl = document.getElementById('balancer-tabs');
      if (!currentVoiceGroup) return;

      const availableSources = [...currentVoiceGroup.allSources];
      let tabsHtml = '';

      if (serverReachable) {
        tabsHtml += `<button class="chip active" data-mode="custom_hls">⚡ Свой HLS-Плеер (Без рекламы)</button>`;
      }
      availableSources.forEach((src, i) => {
        const isAct = (!serverReachable && i === 0) ? 'active' : '';
        tabsHtml += `<button class="chip ${isAct}" data-mode="iframe" data-idx="${i}">▶️ ${src.balancer} (${src.quality})</button>`;
      });

      tabsEl.innerHTML = tabsHtml;
      tabsEl.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          tabsEl.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (btn.dataset.mode === 'custom_hls') {
            launchCustomHlsPlayer(currentVoiceGroup.primarySource);
          } else {
            const chosenSrc = availableSources[Number(btn.dataset.idx)] || currentVoiceGroup.primarySource;
            launchIframePlayer(chosenSrc);
          }
        });
      });

      if (serverReachable) {
        launchCustomHlsPlayer(currentVoiceGroup.primarySource);
      } else {
        launchIframePlayer(currentVoiceGroup.primarySource);
      }
    }

    function getTargetEpisodeLink(sourceObj) {
      if (!sourceObj) return '';
      let link = sourceObj.iframe_url || '';
      const sNum = document.getElementById('m-season').value;
      const firstEp = Array.from(selectedEpisodesSet)[0] || '1';
      if (sourceObj.seasons && sourceObj.seasons[sNum]?.episodes?.[firstEp]) {
        const epVal = sourceObj.seasons[sNum].episodes[firstEp];
        link = typeof epVal === 'string' ? epVal : (epVal.link || link);
      }
      if (link.startsWith('//')) link = 'https:' + link;
      return link;
    }

    async function launchCustomHlsPlayer(sourceObj) {
      stopActivePlayers();
      const targetUrl = getTargetEpisodeLink(sourceObj);
      const vid = document.getElementById('custom-hls-video');
      const ifr = document.getElementById('balancer-iframe');

      try {
        const res = await fetch(`${serverUrl}/api/resolve_stream?url=${encodeURIComponent(targetUrl)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.stream_url && data.is_hls) {
            ifr.style.display = 'none';
            vid.style.display = 'block';
            if (Hls.isSupported()) {
              hlsInstance = new Hls();
              hlsInstance.loadSource(data.stream_url);
              hlsInstance.attachMedia(vid);
              hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
              vid.src = data.stream_url;
              vid.play().catch(() => {});
            }
            return;
          }
        }
      } catch (e) {}
      launchIframePlayer(sourceObj);
    }

    function launchIframePlayer(sourceObj) {
      stopActivePlayers();
      const ifr = document.getElementById('balancer-iframe');
      ifr.style.display = 'block';
      ifr.src = getTargetEpisodeLink(sourceObj);
    }

    function renderSeasonsAndEpisodes(sourceObj) {
      const serialBox = document.getElementById('serial-box');
      const seasonSelect = document.getElementById('m-season');
      const seasonsObj = sourceObj?.seasons;

      if (!seasonsObj || Object.keys(seasonsObj).length === 0) {
        serialBox.classList.remove('active');
        return;
      }

      serialBox.classList.add('active');
      const seasonKeys = Object.keys(seasonsObj).sort((a, b) => Number(a) - Number(b));
      seasonSelect.innerHTML = seasonKeys.map(s => {
        const epCount = Object.keys(seasonsObj[s].episodes || {}).length;
        return `<option value="${s}">Сезон ${s} (${epCount} сер.)</option>`;
      }).join('');

      seasonSelect.onchange = () => renderEpisodeChips(seasonsObj[seasonSelect.value]);
      renderEpisodeChips(seasonsObj[seasonKeys[0]]);
    }

    function renderEpisodeChips(seasonData) {
      const epGrid = document.getElementById('ep-grid');
      const episodesObj = seasonData?.episodes || {};
      const epNums = Object.keys(episodesObj).sort((a, b) => Number(a) - Number(b));

      selectedEpisodesSet = new Set([epNums[0] || '1']);
      epGrid.innerHTML = epNums.map(ep => `
        <div class="ep-chip ${ep === epNums[0] ? 'selected' : ''}" data-ep="${ep}">Сер. ${ep}</div>
      `).join('');

      epGrid.querySelectorAll('.ep-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const ep = chip.dataset.ep;
          if (isWatchOnlineMode) {
            selectedEpisodesSet = new Set([ep]);
            epGrid.querySelectorAll('.ep-chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            renderBalancerTabsAndPlay();
          } else {
            if (selectedEpisodesSet.has(ep) && selectedEpisodesSet.size > 1) {
              selectedEpisodesSet.delete(ep);
              chip.classList.remove('selected');
            } else {
              selectedEpisodesSet.add(ep);
              chip.classList.add('selected');
            }
          }
        });
      });
    }

      btn.addEventListener('click', () => {

        document.getElementById('ep-picker-wrap').style.display = (selectedDownloadScope === 'selected') ? 'flex' : 'none';

    // === 5. ОТПРАВКА НА СКАЧИВАНИЕ (ГИБРИДНЫЙ МОСТ) ===
    document.getElementById('send-task-btn').addEventListener('click', async () => {
      if (!selectedMovie) return;
      recordUserInterest(selectedMovie, 5);

      const isSerial = document.getElementById('serial-box').classList.contains('active');
      const dlMode = isSerial ? selectedDownloadScope : 'movie';
      const chosenIframe = currentVoiceGroup?.primarySource?.iframe_url || '';

      const payload = {
        action: "DOWNLOAD_MEDIA",
        title: selectedMovie.title,
        orig_title: selectedMovie.orig_title || selectedMovie.title,
        year: selectedMovie.year || '',
        kp_id: selectedMovie.kp_id || '',
        imdb_id: selectedMovie.imdb_id || '',
        overview: selectedMovie.overview || '',
        voice: document.getElementById('m-voice').value || '🎬 Дубляж (Официальный)',
        iframe_url: chosenIframe,
        quality: document.getElementById('m-quality').value,
        format: document.getElementById('m-format').value,
        download_mode: dlMode,
        season: isSerial ? document.getElementById('m-season').value : '1',
        episodes: isSerial ? Array.from(selectedEpisodesSet) : [],
        user_id: userTgId ? Number(userTgId) : null
      };

      localTasks.unshift({
        id: 'loc_' + Date.now(),
        title: `${payload.title} (${payload.voice})`,
        stage: 'Задача передана на ПК (Приоритет 1080p)...'
      });
      localStorage.setItem('vg_tasks_v3', JSON.stringify(localTasks.slice(0, 15)));

      const btn = document.getElementById('send-task-btn');
      btn.textContent = '⏳ Отправка задания на сервер...';

      try {
        const res = await fetch(`${serverUrl}/api/webapp_task`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          btn.textContent = '🚀 Скачать в ТГК + продублировать в ЛС';
          document.getElementById('modal').style.display = 'none';
          document.querySelector('[data-pane="pane-tracker"]').click();
          return;
        }
      } catch (e) {}

      try {
        const tgRes = await fetch(`https://api.telegram.org/bot${CLOUD_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CLOUD_CHANNEL_ID,
            text: `VG_TASK_JSON:${JSON.stringify(payload)}`
          })
        });
        if (tgRes.ok) {
          btn.textContent = '🚀 Скачать в ТГК + продублировать в ЛС';
          document.getElementById('modal').style.display = 'none';
          document.querySelector('[data-pane="pane-tracker"]').click();
          return;
        }
      } catch (e) {}

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      }
    });

    // === 6. УМНЫЕ РЕКОМЕНДАЦИИ И ТРЕКЕР ===
    function extractFranchiseRoot(title) {
      return title
        .replace(/\(\d{4}\)/g, '')
        .split(/[:—\-–.|]/)[0]
        .replace(/\b(\d+|I|II|III|IV|V|VI|VII|VIII|IX|X|Часть|Сезон|Фильм|Эпизод)\b.*$/i, '')
        .trim();
    }

    function recordUserInterest(movie, weight = 1) {
      if (!movie || !movie.title) return;
      const root = extractFranchiseRoot(movie.title);
      const existing = tasteHistory.find(x => x.root.toLowerCase() === root.toLowerCase());
      if (existing) {
        existing.score += weight;
        existing.genre = (movie.genres && movie.genres[0]) || existing.genre;
        existing.ts = Date.now();
      } else {
        tasteHistory.unshift({
          root: root,
          genre: (movie.genres && movie.genres[0]) || 'фантастика',
          score: weight,
          ts: Date.now()
        });
      }
      tasteHistory.sort((a, b) => b.score - a.score || b.ts - a.ts);
      tasteHistory = tasteHistory.slice(0, 12);
      localStorage.setItem('vg_taste_v3', JSON.stringify(tasteHistory));
    }

    async function renderSmartRecommendations() {
      const container = document.getElementById('recs-shelves');
      const label = document.getElementById('taste-profile-label');
      container.innerHTML = `<div class="status-msg">Собираем персональные полки...</div>`;

      const shelves = [];
      if (tasteHistory.length > 0) {
        const top1 = tasteHistory[0];
        label.textContent = `Твой главный интерес: «${top1.root}» (${top1.score} балл.)`;
        shelves.push({ title: `🎬 Все части, сериалы и спин-оффы: «${top1.root}»`, query: top1.root });
        if (tasteHistory[1]) {
          shelves.push({ title: `🔥 Похожее и продолжения: «${tasteHistory[1].root}»`, query: tasteHistory[1].root });
        }
        shelves.push({ title: `✨ Лучшее в жанре: ${top1.genre}`, query: top1.genre });
      } else {
        shelves.push(
          { title: `🌌 Вселенная Звёздных войн`, query: `Звёздные войны` },
          { title: `🏆 Хиты в 1080p`, query: `Дюна` }
        );
      }

      container.innerHTML = '';
      for (const sh of shelves) {
        const items = await fetchMoviesByQuery(sh.query);
        if (!items.length) continue;
        const block = document.createElement('div');
        block.className = 'shelf-block';
        block.innerHTML = `<div class="shelf-title">${sh.title}</div><div class="shelf-row"></div>`;
        renderMoviesToGrid(items.slice(0, 10), block.querySelector('.shelf-row'));
        container.appendChild(block);
      }
    }

    document.getElementById('reset-taste-btn').addEventListener('click', () => {
      tasteHistory = [];
      localStorage.setItem('vg_taste_v3', '[]');
      renderSmartRecommendations();
    });

    async function pollServerStatus() {
      const dot = document.getElementById('srv-dot');
      try {
        const res = await fetch(`${serverUrl}/api/status`, { signal: AbortSignal.timeout(2500) });
        if (res.ok) {
          const data = await res.json();
          serverReachable = true;
          dot.classList.add('online');
          renderTrackerFromServer(data.tasks || {}, data.history || []);
          return;
        }
      } catch (e) {
        serverReachable = false;
        dot.classList.remove('online');
      }
      renderTrackerOffline();
    }

    async function sendJobControl(jobId, action) {
      try {
        await fetch(`${serverUrl}/api/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_id: jobId, action: action })
        });
        pollServerStatus();
      } catch (e) {}
    }

    function renderTrackerFromServer(tasksObj, historyList) {
      const container = document.getElementById('tasks-container');
      const entries = Object.entries(tasksObj);
      if (entries.length === 0 && historyList.length === 0) {
        container.innerHTML = `<div class="status-msg">Активных загрузок на ПК нет.</div>`;
        return;
      }

      let html = entries.map(([jid, t]) => `
        <div class="task-card">
          <div class="task-top">
            <span class="task-title">${t.title}</span>
            <div class="task-ctrl-btns">
              ${t.status === 'paused'
                ? `<button class="mini-ctrl" onclick="sendJobControl('${jid}','resume')">▶ Пуск</button>`
                : `<button class="mini-ctrl" onclick="sendJobControl('${jid}','pause')">⏸ Пауза</button>`}
              <button class="mini-ctrl" style="color:var(--danger);" onclick="sendJobControl('${jid}','cancel')">✕ Отмена</button>
            </div>
          </div>
          <div style="font-size:11.5px; color:var(--accent);">${t.stage} ${t.speed ? '• ' + t.speed : ''}</div>
          <div class="task-bar"><div class="task-bar-fill" style="width:${t.progress || 5}%;"></div></div>
        </div>
      `).join('');

      if (historyList.length > 0) {
        html += `<div style="font-size:12px; font-weight:700; margin:12px 0 8px; color:var(--text-muted);">✅ Выгружено в ТГК и очищено с ПК:</div>`;
        html += historyList.map(h => `
          <div class="task-card">
            <div class="task-top">
              <span class="task-title">${h.title} (${h.quality})</span>
              <span style="font-size:11px; color:var(--green);">${h.size}</span>
            </div>
            ${h.post_url ? `<a href="${h.post_url}" target="_blank" style="font-size:11.5px; color:var(--accent);">🍿 Открыть в ТГК</a>` : ''}
          </div>
        `).join('');
      }
      container.innerHTML = html;
    }

    function renderTrackerOffline() {
      const container = document.getElementById('tasks-container');
      if (!localTasks.length) {
        container.innerHTML = `<div class="status-msg">Задачи отправляются через облачный мост Telegram. Прогресс-бар обновляется в чате с ботом!</div>`;
        return;
      }
      container.innerHTML = localTasks.map(t => `
        <div class="task-card">
          <div class="task-title">${t.title}</div>
          <div style="font-size:11.5px; color:var(--accent); margin-top:4px;">📡 ${t.stage}</div>
        </div>
      `).join('');
    }

    document.getElementById('clear-tasks-btn').addEventListener('click', () => {
      localTasks = [];
      localStorage.setItem('vg_tasks_v3', '[]');
      pollServerStatus();
    });

    let currentListMode = 'watchlist';
    function renderSavedLists() {
      document.getElementById('cnt-watch').textContent = watchlist.length;
      document.getElementById('cnt-watched').textContent = watched.length;
      const src = currentListMode === 'watchlist' ? watchlist : watched;
      const grid = document.getElementById('lists-grid');
      const empty = document.getElementById('lists-empty');
      if (!src.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        renderMoviesToGrid(src, grid);
      }
    }

    document.getElementById('btn-show-watchlist').addEventListener('click', (e) => {
      currentListMode = 'watchlist';
      e.target.classList.add('active');
      document.getElementById('btn-show-watched').classList.remove('active');
      renderSavedLists();
    });
    document.getElementById('btn-show-watched').addEventListener('click', (e) => {
      currentListMode = 'watched';
      e.target.classList.add('active');
      document.getElementById('btn-show-watchlist').classList.remove('active');
      renderSavedLists();
    });

    document.getElementById('m-add-watch').addEventListener('click', () => {
      if (!selectedMovie) return;
      const i = watchlist.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watchlist.splice(i, 1); else watchlist.unshift(selectedMovie);
      localStorage.setItem('vg_watchlist', JSON.stringify(watchlist));
      renderSavedLists();
    });
    document.getElementById('m-add-watched').addEventListener('click', () => {
      if (!selectedMovie) return;
      const i = watched.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watched.splice(i, 1); else watched.unshift(selectedMovie);
      localStorage.setItem('vg_watched', JSON.stringify(watched));
      renderSavedLists();
    });

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => searchMovies(e.target.value.trim()), 350);
    });

    setInterval(pollServerStatus, 3500);
    pollServerStatus();
    searchMovies('');
  </script>
</body>
</html>
