<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CleanYourTV OS v5.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #070b14; --glass: rgba(19, 27, 46, 0.8); --glass-hi: rgba(15, 23, 42, 0.95);
      --card: #11192c; --accent: #00d2ff; --glow: rgba(0, 210, 255, 0.55);
      --green: #22c55e; --danger: #ef4444; --text: #f8fafc; --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1); --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #13203d 0%, var(--bg) 70%);
      color: var(--text); padding: 12px 14px 100px; min-height: 100vh; overflow-x: hidden;
    }
    .topbar, .drawer, .main { max-width: 1160px; margin: 0 auto 16px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 16px;
    }
    .logo { background: linear-gradient(135deg, #00d2ff, #2563eb); font-weight: 900; font-size: 12px; padding: 5px 10px; border-radius: 9px; }
    .pill {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
      font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 11px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: transform 0.2s var(--spring);
    }
    .pill:hover { transform: scale(1.05); border-color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
    .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .drawer { display: none; background: var(--glass-hi); border: 1px solid var(--border); padding: 14px; border-radius: 16px; gap: 10px; flex-direction: column; }
    .drawer.open { display: flex; }
    .drawer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    input, select {
      width: 100%; background: rgba(0,0,0,0.45); border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 11px; font-size: 13px; outline: none;
    }
    input:focus { border-color: var(--accent); }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
    @media (min-width: 980px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 18px; } }

    .card {
      background: var(--card); border-radius: 15px; overflow: hidden; border: 2px solid transparent;
      display: flex; flex-direction: column; cursor: pointer; position: relative;
      transition: transform 0.26s var(--spring), border-color 0.2s, box-shadow 0.26s;
    }
    .card:hover, .card.tv-focus {
      transform: translateY(-5px) scale(1.04); border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow), 0 14px 28px rgba(0,0,0,0.6); z-index: 4;
    }
    .poster { width: 100%; aspect-ratio: 2/3; background: #162038; position: relative; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 7px; right: 7px; background: rgba(7,11,20,0.85); color: #fbbf24; font-weight: 800; font-size: 11px; padding: 2px 7px; border-radius: 7px; }
    .c-info { padding: 9px 11px; }
    .c-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-meta { font-size: 11px; color: var(--muted); }

    .shelf-row { display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: none; }
    .shelf-row::-webkit-scrollbar { display: none; }
    .shelf-row .card { min-width: 145px; max-width: 145px; flex-shrink: 0; }

    /* Парящий Dock */
    .dock-wrap { position: fixed; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; z-index: 90; pointer-events: none; }
    .dock {
      pointer-events: auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.14); padding: 7px 12px; border-radius: 22px; display: flex; gap: 8px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.65);
    }
    .dock-btn {
      background: transparent; border: none; color: var(--muted); padding: 7px 14px; border-radius: 14px;
      font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; transition: transform 0.24s var(--spring), color 0.2s, background 0.2s;
    }
    .dock-btn:hover { transform: translateY(-5px) scale(1.12); color: var(--text); }
    .dock-btn.active { color: var(--accent); background: rgba(0, 210, 255, 0.14); }

    /* Шторка карточки */
    .overlay {
      position: fixed; inset: 0; background: rgba(4, 7, 15, 0.82); backdrop-filter: blur(10px);
      display: none; align-items: flex-end; justify-content: center; z-index: 120;
    }
    @media (min-width: 768px) { .overlay { align-items: center; padding: 18px; } }
    .sheet {
      width: 100%; max-width: 700px; background: var(--glass-hi); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px 24px 0 0; padding: 10px 16px 20px; max-height: 82vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; position: relative;
      transition: transform 0.3s, max-height 0.3s;
    }
    .sheet.fullscreen { max-height: 98vh; height: 98vh; }
    @media (min-width: 768px) { .sheet { border-radius: 24px; max-height: 90vh; padding: 18px 22px; } }
    .drag-bar { padding: 4px 0 6px; cursor: grab; touch-action: none; }
    .drag-pill { width: 42px; height: 5px; background: rgba(255,255,255,0.25); border-radius: 8px; margin: 0 auto; }
    .top-acts { position: absolute; top: 12px; right: 14px; display: flex; gap: 7px; z-index: 10; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1);
      border: 1px solid var(--border); color: var(--text); font-weight: 800; cursor: pointer;
    }

    .mode-switch { display: flex; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 4px; }
    .mode-btn { flex: 1; background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 9px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .mode-btn.active { background: rgba(0, 210, 255, 0.16); color: var(--accent); border: 1px solid rgba(0, 210, 255, 0.35); }

    .player-wrap { display: none; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .player-wrap.active { display: block; }
    .player-wrap iframe, .player-wrap video { width: 100%; height: 100%; border: none; display: block; }

    .ctrl-bar { display: flex; gap: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 7px; border-radius: 13px; }
    .ctrl-btn {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 9px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; cursor: pointer;
    }
    .ctrl-btn b { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }

    .popover { display: none; flex-direction: column; gap: 4px; background: #0e1628; border: 1px solid var(--accent); border-radius: 12px; padding: 8px; max-height: 190px; overflow-y: auto; }
    .popover.open { display: flex; }
    .pop-opt {
      background: rgba(255,255,255,0.04); border: 1px solid transparent; color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer;
    }
    .pop-opt.selected { background: rgba(0, 210, 255, 0.15); border-color: var(--accent); color: var(--accent); }

    .serial-box { display: none; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.35); border: 1px solid var(--border); padding: 10px; border-radius: 12px; }
    .serial-box.active { display: flex; }
    .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-height: 105px; overflow-y: auto; }
    .chip { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 7px; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }

    .act-btn { background: linear-gradient(135deg, #00d2ff, #0284c7); color: #000; font-weight: 900; font-size: 14px; border: none; border-radius: 12px; padding: 13px; cursor: pointer; }
    .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-bottom: 8px; }
    .bar { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.3s; }
    .msg { text-align: center; font-size: 13px; color: var(--muted); padding: 26px 10px; }
  </style>
</head>
<body>

  <header class="topbar">
    <div style="display:flex; align-items:center; gap:9px;">
      <span class="logo">CleanYourTV</span><b style="font-size:13px;">OS 5.0</b>
      <span class="dot" id="srv-dot"></span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="pill" id="sfx-btn">🔊</button>
      <button class="pill" id="cfg-btn">⚙️ Система</button>
      <b id="clock" style="font-size:12.5px;">00:00</b>
    </div>
  </header>

  <div class="drawer" id="drawer">
    <div class="drawer-grid">
      <input id="in-srv" placeholder="Сервер (http://127.0.0.1:8765)">
      <input id="in-uid" placeholder="Твой Telegram ID">
      <input id="in-kp" placeholder="API-ключ Кинопоиска">
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:11px; color:var(--muted);">🎮 Управление на ПК: стрелки ⬅️⬆️⬇️➡️, Enter, Esc</span>
      <button class="pill" id="save-cfg" style="background:var(--accent); color:#000;">✓ Сохранить</button>
    </div>
  </div>

  <main class="main">
    <div class="tab-pane active" id="pane-search">
      <input id="search-in" placeholder="🔍 Поиск фильмов, сериалов и аниме..." style="margin-bottom:14px;">
      <div id="status" class="msg">Загрузка витрины...</div>
      <div class="grid" id="grid-search"></div>
    </div>

    <div class="tab-pane" id="pane-recs">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:12px; color:var(--muted);" id="taste-lbl">Персональные полки</span>
        <button class="pill" id="reset-taste">Сбросить вкус</button>
      </div>
      <div id="shelves"></div>
    </div>

    <div class="tab-pane" id="pane-lists">
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button class="pill" id="tab-watch">🔖 Хочу посмотреть (<span id="cnt-w">0</span>)</button>
        <button class="pill" id="tab-watched">👁 Просмотрено (<span id="cnt-d">0</span>)</button>
      </div>
      <div class="grid" id="grid-lists"></div>
    </div>

    <div class="tab-pane" id="pane-tracker">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <b>📡 Задачи и история ТГК</b>
        <div style="display:flex; gap:6px;">
          <button class="pill" id="ping-btn">🔄 Обновить</button>
          <button class="pill" id="clear-tasks">Очистить</button>
        </div>
      </div>
      <div id="tasks-box"></div>
    </div>
  </main>

  <!-- Модальное окно -->
  <div class="overlay" id="modal">
    <div class="sheet" id="sheet">
      <div class="drag-bar" id="drag-bar"><div class="drag-pill"></div></div>
      <div class="top-acts">
        <button class="icon-btn" id="full-btn">⛶</button>
        <button class="icon-btn" id="close-btn">✕</button>
      </div>

      <div style="display:flex; gap:12px; padding-right:68px;">
        <img id="m-poster" style="width:72px; aspect-ratio:2/3; border-radius:10px; object-fit:cover;">
        <div>
          <h2 id="m-title" style="font-size:15.5px;"></h2>
          <p id="m-meta" style="font-size:11.5px; color:var(--muted); margin:3px 0;"></p>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="pill" id="add-w">🔖 В список</button>
            <button class="pill" id="add-d">👁 Смотрел</button>
          </div>
        </div>
      </div>

      <div class="mode-switch">
        <button class="mode-btn active" id="mode-dl">🚀 Скачать в ТГК (1080p)</button>
        <button class="mode-btn" id="mode-watch">▶️ Смотреть онлайн</button>
      </div>

      <div class="player-wrap" id="player-wrap">
        <video id="hls-video" controls playsinline style="display:none;"></video>
        <iframe id="iframe-player" allowfullscreen allow="autoplay *; fullscreen *"></iframe>
      </div>

      <!-- Единый нижний Control Bar -->
      <div class="ctrl-bar">
        <button class="ctrl-btn" id="open-voices"><span>🎙 Озвучка:</span><b id="cur-voice">...</b></button>
        <button class="ctrl-btn" id="open-players"><span>⚡ Плеер:</span><b id="cur-player">Авто</b></button>
      </div>
      <div class="popover" id="pop-voices"></div>
      <div class="popover" id="pop-players"></div>

      <!-- Сезоны и серии -->
      <div class="serial-box" id="serial-box">
        <div style="display:flex; gap:6px; overflow-x:auto;" id="season-row"></div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;" id="scope-row">
          <div class="chip active" data-s="selected">Выбрать серии</div>
          <div class="chip" data-s="season">Весь сезон</div>
          <div class="chip" data-s="all_seasons">Весь сериал</div>
        </div>
        <div class="ep-grid" id="ep-grid"></div>
      </div>

      <div id="dl-box" style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; gap:8px;">
          <select id="m-qual">
            <option value="1080" selected>🔥 1080p (Full HD)</option>
            <option value="720">720p (HD)</option>
            <option value="480">480p</option>
          </select>
          <select id="m-fmt"><option value="mp4" selected>MP4 (iOS/Android)</option><option value="mkv">MKV</option></select>
        </div>
        <button class="act-btn" id="dl-btn">🚀 Скачать в ТГК + прислать в ЛС</button>
      </div>
    </div>
  </div>

  <div class="dock-wrap">
    <nav class="dock">
      <button class="dock-btn active" data-p="pane-search"><span>🔍</span><span>Поиск</span></button>
      <button class="dock-btn" data-p="pane-recs"><span>✨</span><span>Для тебя</span></button>
      <button class="dock-btn" data-p="pane-lists"><span>📌</span><span>Списки</span></button>
      <button class="dock-btn" data-p="pane-tracker"><span>📊</span><span>Загрузки</span></button>
    </nav>
  </div>

  <script>
    const tg = window.Telegram?.WebApp; if (tg) tg.expand();
    const $ = id => document.getElementById(id);
    const store = {
      get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
    };

    const DEF_KP = "499be78a-5444-4620-b192-b8888fcb7143";
    const KODIK_TOK = "0494164a3e824c4b4a68393cb5622014";
    const BOT_TOK = "9127267176:AAHPmwAUw5H_dQPiCsZqLoRisA_-pGnw6as";
    const CHAN_ID = "-1004332808314";

    let srvUrl = localStorage.getItem('vg_srv') || 'http://127.0.0.1:8765';
    let kpKey = localStorage.getItem('vg_kp') || DEF_KP;
    let tgUid = localStorage.getItem('vg_uid') || String(tg?.initDataUnsafe?.user?.id || '');
    let sfxOn = localStorage.getItem('vg_sfx') !== 'off';

    let watchlist = store.get('vg_watch', []), watched = store.get('vg_watched', []);
    let taste = store.get('vg_taste', []), locTasks = store.get('vg_tasks', []);
    const memCache = new Map();

    let curMovie = null, voiceGroups = [], curGroup = null, curSource = null;
    let curSeason = '1', dlScope = 'selected', epSet = new Set(['1']);
    let watchMode = false, srvOnline = false, hls = null, focusIdx = -1, listMode = 'watch';

    $('in-srv').value = srvUrl; $('in-kp').value = kpKey; $('in-uid').value = tgUid;

    // 1. Звуковой синтезатор Nintendo Switch
    let actx = null;
    function sfx(t = 'tick') {
      if (!sfxOn) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
        o.connect(g); g.connect(actx.destination);
        o.type = t === 'pop' ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(t === 'pop' ? 520 : 880, now);
        o.frequency.exponentialRampToValueAtTime(t === 'pop' ? 1040 : 1320, now + (t === 'pop' ? 0.05 : 0.025));
        g.gain.setValueAtTime(t === 'pop' ? 0.06 : 0.035, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + (t === 'pop' ? 0.06 : 0.03));
        o.start(now); o.stop(now + 0.065);
      } catch {}
    }
    const updSfxBtn = () => $('sfx-btn').textContent = sfxOn ? '🔊' : '🔇';
    updSfxBtn();
    $('sfx-btn').onclick = () => { sfxOn = !sfxOn; localStorage.setItem('vg_sfx', sfxOn ? 'on' : 'off'); updSfxBtn(); sfx('pop'); };
    setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }), 10000);
    $('clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });

    // 2. Нормализация озвучек
    const V_RULES = [
      ["🎬 Дубляж (Официальный)", ["дубляж", "дублирован", "мосфильм", "пифагор", "лицензия", "red head sound", "rhs", "dub"]],
      ["🎙 HDRezka Studio", ["hdrezka", "rezka", "резка"]],
      ["🎙 Кубик в Кубе", ["кубик", "kubik"]],
      ["🎙 LostFilm", ["lostfilm", "лостфильм"]],
      ["🎙 TVShows", ["tvshows", "твшоус"]],
      ["🎙 Jaskier", ["jaskier", "яскьер"]],
      ["🎙 АниЛибрия", ["anilibria", "анилибрия"]],
      ["🎙 Студийная Банда", ["студийная банда"]],
      ["🎙 Авторский (Гоблин)", ["гоблин", "пучков", "гаврилов"]],
      ["🇬🇧 Оригинал (Eng + Sub)", ["оригинал", "original", "eng", "sub"]]
    ];
    const normVoice = r => {
      const low = (r || '').toLowerCase();
      for (const [c, ks] of V_RULES) if (ks.some(k => low.includes(k))) return c;
      const cl = (r || '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
      return cl ? `🎙 ${cl}` : "🎬 Дубляж (Официальный)";
    };
    const fixMirror = u => u ? (u.startsWith('//') ? 'https:' + u : u).replace(/kodik\.info|aniqit\.com/g, 'kodik.biz') : '';

    // 3. Навигация Dock + Клавиатура ПК
    document.querySelectorAll('.dock-btn').forEach(b => b.onclick = () => {
      sfx('pop');
      document.querySelectorAll('.dock-btn, .tab-pane').forEach(el => el.classList.remove('active'));
      b.classList.add('active'); $(b.dataset.p).classList.add('active'); focusIdx = -1;
      if (b.dataset.p === 'pane-recs') renderRecs();
      if (b.dataset.p === 'pane-lists') renderLists();
      if (b.dataset.p === 'pane-tracker') pingServer();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && $('modal').style.display === 'flex') return closeModal();
      if ($('modal').style.display === 'flex' || document.activeElement.tagName === 'INPUT') return;
      const cards = [...document.querySelectorAll('.tab-pane.active .card')];
      if (!cards.length) return;
      const cols = innerWidth >= 980 ? 5 : (innerWidth >= 640 ? 4 : 2);
      const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
      if (step !== undefined) {
        e.preventDefault(); sfx('tick');
        focusIdx = Math.max(0, Math.min(cards.length - 1, focusIdx < 0 ? 0 : focusIdx + step));
        cards.forEach((c, i) => c.classList.toggle('tv-focus', i === focusIdx));
        cards[focusIdx]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else if (e.key === 'Enter' && cards[focusIdx]) cards[focusIdx].click();
    });

    $('cfg-btn').onclick = () => { sfx(); $('drawer').classList.toggle('open'); };
    $('save-cfg').onclick = () => {
      sfx('pop');
      srvUrl = $('in-srv').value.trim().replace(/\/$/, '') || 'http://127.0.0.1:8765';
      kpKey = $('in-kp').value.trim() || DEF_KP; tgUid = $('in-uid').value.trim();
      localStorage.setItem('vg_srv', srvUrl); localStorage.setItem('vg_kp', kpKey); localStorage.setItem('vg_uid', tgUid);
      $('drawer').classList.remove('open'); pingServer();
    };

    // 4. Быстрый поиск озвучек и плееров (с кэшем)
    async function fetchSourcesFast(m) {
      const key = `${m.kp_id}_${m.imdb_id}_${m.title}`.toLowerCase();
      if (memCache.has(key)) return memCache.get(key);

      const list = [];
      if (m.kp_id) list.push({ balancer: 'MultiPlayer HD', voice_canonical: '🎬 Дубляж (Официальный)', voice_raw: 'Мульти-плеер 1080p', quality: '1080p', quality_rank: 1080, iframe_url: `https://ddbb.lol/?kp=${m.kp_id}`, seasons: {} });
      if (m.imdb_id) list.push({ balancer: 'VidSrc 1080p', voice_canonical: '🇬🇧 Оригинал (Eng + Sub)', voice_raw: 'English 1080p', quality: '1080p', quality_rank: 1080, iframe_url: `https://vidsrc.xyz/embed/movie/${m.imdb_id}`, seasons: {} });

      const cleanT = m.title.replace(/\(\d{4}\)|[:\-–]/g, ' ').trim();
      if (srvOnline) {
        try {
          const q = new URLSearchParams({ title: cleanT, orig_title: m.orig_title || '', year: m.year || '', kp_id: m.kp_id || '', imdb_id: m.imdb_id || '' });
          const r = await fetch(`${srvUrl}/api/sources?${q}`, { signal: AbortSignal.timeout(2000) });
          if (r.ok) {
            const d = await r.json();
            if (d.results?.length) { const res = [...d.results, ...list]; memCache.set(key, res); return res; }
          }
        } catch {}
      }

      const fastGet = async u => {
        for (const t of [u, `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]) {
          try { const r = await fetch(t, { signal: AbortSignal.timeout(1900) }); if (r.ok) return await r.json(); } catch {}
        }
        return null;
      };

      const kdUrl = m.kp_id ? `https://kodikapi.com/search?token=${KODIK_TOK}&kinopoisk_id=${m.kp_id}&with_episodes=true` : `https://kodikapi.com/search?token=${KODIK_TOK}&title=${encodeURIComponent(cleanT)}&with_episodes=true`;
      const [kdRes, kbRes] = await Promise.allSettled([fastGet(kdUrl), m.kp_id ? fastGet(`https://api.kinobox.tv/api/players?kinopoisk=${m.kp_id}`) : null]);

      (kdRes.value?.results || []).forEach(it => {
        const rv = it.translation?.title || 'Дубляж';
        const seasons = {};
        if (it.seasons) Object.entries(it.seasons).forEach(([sk, sv]) => {
          seasons[sk] = { episodes: Object.fromEntries(Object.entries(sv.episodes || {}).map(([ek, ev]) => [ek, fixMirror(typeof ev === 'string' ? ev : ev.link)])) };
        });
        list.push({ balancer: 'Kodik', voice_canonical: normVoice(rv), voice_raw: rv, quality: '1080p', quality_rank: 1080, iframe_url: fixMirror(it.link), is_serial: Boolean(it.seasons), seasons });
      });

      const kbItems = Array.isArray(kbRes.value) ? kbRes.value : (kbRes.value?.data || []);
      kbItems.forEach(p => {
        const b = (p.type || p.source || 'Alloha').toUpperCase(), ifr = fixMirror(p.iframeUrl || p.url);
        if (!ifr || b === 'KODIK') return;
        (p.translations || [{ name: 'Дубляж' }]).forEach(tr => {
          const rv = tr.name || tr.title || 'Дубляж';
          list.push({ balancer: b, voice_canonical: normVoice(rv), voice_raw: rv, quality: '1080p', quality_rank: 1080, iframe_url: ifr, seasons: {} });
        });
      });

      memCache.set(key, list);
      return list;
    }

    // 5. Модалка, Control Bar и Плееры
    async function openCard(m) {
      sfx('pop'); curMovie = m; addInterest(m, 1);
      $('sheet').classList.remove('fullscreen'); $('sheet').style.transform = '';
      $('m-poster').src = m.poster || `https://placehold.co/300x450/11192c/00d2ff?text=${encodeURIComponent(m.title.slice(0, 14))}`;
      $('m-title').textContent = `${m.title} ${m.year ? '(' + m.year + ')' : ''}`;
      $('m-meta').textContent = `★ ${m.rating} • ${m.director || 'Кино'}`;
      $('pop-voices').classList.remove('open'); $('pop-players').classList.remove('open');
      setMode(false); $('modal').style.display = 'flex';
      $('cur-voice').textContent = 'Загрузка...';

      const raw = await fetchSourcesFast(m);
      const map = new Map();
      raw.forEach(s => {
        if (!map.has(s.voice_canonical)) map.set(s.voice_canonical, { canon: s.voice_canonical, primary: s, all: [s] });
        else { const g = map.get(s.voice_canonical); g.all.push(s); if (s.is_serial && !g.primary.is_serial) g.primary = s; }
      });
      voiceGroups = [...map.values()];
      if (!voiceGroups.length) voiceGroups = [{ canon: '🎬 Дубляж (Официальный)', primary: { balancer: 'Auto', iframe_url: '', seasons: {} }, all: [] }];
      pickVoiceGroup(voiceGroups[0]);
    }

    function pickVoiceGroup(g) {
      curGroup = g; curSource = g.primary;
      $('cur-voice').textContent = g.canon.replace(/^[^\s]+\s/, '');
      $('cur-player').textContent = curSource.balancer;
      renderSeasons(curSource); renderPopovers();
      if (watchMode) playCurrent();
    }

    function renderPopovers() {
      $('pop-voices').innerHTML = voiceGroups.map((g, i) => `<div class="pop-opt ${g === curGroup ? 'selected' : ''}" data-i="${i}"><span>${g.canon}</span><b>1080p • ${g.all.length} пл.</b></div>`).join('');
      $('pop-voices').querySelectorAll('.pop-opt').forEach(el => el.onclick = () => { sfx(); pickVoiceGroup(voiceGroups[el.dataset.i]); $('pop-voices').classList.remove('open'); });

      let pHtml = srvOnline ? `<div class="pop-opt" data-hls="1"><span>⚡ Свой CleanYourTV HLS-Плеер</span><b>Без рекламы</b></div>` : '';
      pHtml += (curGroup?.all || []).map((s, i) => `<div class="pop-opt ${s === curSource ? 'selected' : ''}" data-i="${i}"><span>▶️ ${s.balancer} (${s.voice_raw})</span><b>${s.quality}</b></div>`).join('');
      $('pop-players').innerHTML = pHtml;
      $('pop-players').querySelectorAll('.pop-opt').forEach(el => el.onclick = () => {
        sfx(); $('pop-players').classList.remove('open');
        if (!watchMode) setMode(true);
        if (el.dataset.hls) { $('cur-player').textContent = 'Свой HLS'; playCustomHls(curSource); }
        else { curSource = curGroup.all[el.dataset.i]; $('cur-player').textContent = curSource.balancer; renderSeasons(curSource); playCurrent(); }
      });
    }

    $('open-voices').onclick = () => { sfx(); $('pop-players').classList.remove('open'); $('pop-voices').classList.toggle('open'); };
    $('open-players').onclick = () => { sfx(); $('pop-voices').classList.remove('open'); $('pop-players').classList.toggle('open'); };

    function setMode(watch) {
      watchMode = watch;
      $('mode-watch').classList.toggle('active', watch); $('mode-dl').classList.toggle('active', !watch);
      $('player-wrap').classList.toggle('active', watch);
      $('dl-box').style.display = watch ? 'none' : 'flex';
      $('scope-row').style.display = watch ? 'none' : 'grid';
      if (watch) { addInterest(curMovie, 3); playCurrent(); } else stopPlayers();
    }
    $('mode-watch').onclick = () => { sfx('pop'); setMode(true); };
    $('mode-dl').onclick = () => { sfx('pop'); setMode(false); };

    function stopPlayers() {
      if (hls) { hls.destroy(); hls = null; }
      $('hls-video').pause(); $('hls-video').style.display = 'none';
      $('iframe-player').src = ''; $('iframe-player').style.display = 'block';
    }

    function getEpUrl(src) {
      if (!src) return '';
      const ep = [...epSet][0] || '1';
      return fixMirror(src.seasons?.[curSeason]?.episodes?.[ep] || src.iframe_url || (curMovie?.kp_id ? `https://ddbb.lol/?kp=${curMovie.kp_id}` : ''));
    }

    function playCurrent() {
      stopPlayers();
      $('iframe-player').src = getEpUrl(curSource);
    }

    async function playCustomHls(src) {
      stopPlayers();
      try {
        const r = await fetch(`${srvUrl}/api/resolve_stream?url=${encodeURIComponent(getEpUrl(src))}`);
        const d = await r.json();
        if (d.proxy_url && d.is_hls) {
          const u = `${srvUrl}${d.proxy_url}`, v = $('hls-video');
          $('iframe-player').style.display = 'none'; v.style.display = 'block';
          if (Hls.isSupported()) { hls = new Hls(); hls.loadSource(u); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{})); }
          else { v.src = u; v.play().catch(()=>{}); }
          return;
        }
      } catch {}
      playCurrent();
    }

    function renderSeasons(src) {
      const sObj = src?.seasons;
      if (!sObj || !Object.keys(sObj).length) return $('serial-box').classList.remove('active');
      $('serial-box').classList.add('active');
      const keys = Object.keys(sObj).sort((a, b) => a - b);
      curSeason = keys[0];
      $('season-row').innerHTML = keys.map(k => `<div class="chip ${k === curSeason ? 'active' : ''}" data-s="${k}">Сезон ${k}</div>`).join('');
      $('season-row').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
        sfx(); curSeason = ch.dataset.s;
        $('season-row').querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === ch));
        renderEps(sObj[curSeason]);
      });
      renderEps(sObj[curSeason]);
    }

    function renderEps(sData) {
      const eps = Object.keys(sData?.episodes || {}).sort((a, b) => a - b);
      epSet = new Set([eps[0] || '1']);
      $('ep-grid').innerHTML = eps.map(e => `<div class="chip ${e === eps[0] ? 'active' : ''}" data-e="${e}">Сер. ${e}</div>`).join('');
      $('ep-grid').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
        sfx(); const e = ch.dataset.e;
        if (watchMode) { epSet = new Set([e]); $('ep-grid').querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === ch)); playCurrent(); }
        else { epSet.has(e) && epSet.size > 1 ? epSet.delete(e) : epSet.add(e); ch.classList.toggle('active', epSet.has(e)); }
      });
    }

    $('scope-row').querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
      sfx(); dlScope = ch.dataset.s;
      $('scope-row').querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === ch));
      $('ep-grid').style.display = dlScope === 'selected' ? 'grid' : 'none';
    });

    // 6. Свайп шторки и закрытие
    function closeModal() { sfx(); stopPlayers(); $('modal').style.display = 'none'; }
    $('close-btn').onclick = closeModal;
    $('full-btn').onclick = () => { sfx('pop'); $('sheet').classList.toggle('fullscreen'); };
    $('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

    let sy = 0, dy = 0;
    $('drag-bar').addEventListener('touchstart', e => { sy = e.touches[0].clientY; dy = 0; $('sheet').style.transition = 'none'; }, { passive: true });
    $('drag-bar').addEventListener('touchmove', e => { dy = e.touches[0].clientY - sy; if (dy > 0) $('sheet').style.transform = `translateY(${dy}px)`; }, { passive: true });
    $('drag-bar').addEventListener('touchend', () => {
      $('sheet').style.transition = '';
      if (dy > 90) closeModal();
      else if (dy < -45) { sfx('pop'); $('sheet').classList.add('fullscreen'); $('sheet').style.transform = ''; }
      else $('sheet').style.transform = '';
    });

    // 7. Поиск каталога и постеров
    const badPoster = u => !u || /no-poster|noposter|empty|placeholder/i.test(u);
    async function fixPoster(m, img) {
      try {
        const r = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent((m.orig_title || m.title) + ' ' + (m.year || ''))}`);
        const d = await r.json();
        const p = (d.description || []).find(x => !badPoster(x['#IMG_POSTER']))?.['#IMG_POSTER'];
        if (p) { img.src = m.poster = p; }
      } catch {}
    }

    async function queryCatalog(q) {
      try {
        const u = q ? `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(q)}` : `https://kinopoiskapiunofficial.tech/api/v2.2/films/collections?type=TOP_POPULAR_ALL&page=1`;
        const r = await fetch(u, { headers: { 'X-API-KEY': kpKey } });
        const d = await r.json();
        return (d.films || d.items || []).map(f => ({
          id: String(f.filmId || f.kinopoiskId || ''), kp_id: String(f.filmId || f.kinopoiskId || ''), imdb_id: String(f.imdbId || ''),
          title: f.nameRu || f.nameEn || f.nameOriginal || 'Фильм', orig_title: f.nameEn || f.nameOriginal || '',
          year: String(f.year || ''), poster: badPoster(f.posterUrlPreview) ? '' : f.posterUrlPreview,
          rating: (f.rating && f.rating !== 'null') ? f.rating : (f.ratingKinopoisk || 'HD'),
          genre: f.genres?.[0]?.genre || 'фантастика', director: (f.genres || []).map(g => g.genre).slice(0, 2).join(', '),
          overview: f.description || ''
        }));
      } catch { return []; }
    }

    function renderGrid(list, box) {
      box.innerHTML = '';
      list.forEach(m => {
        const el = document.createElement('div'); el.className = 'card';
        const fb = `https://placehold.co/300x450/11192c/00d2ff?text=${encodeURIComponent(m.title.slice(0, 14))}`;
        el.innerHTML = `<div class="poster"><img src="${m.poster || fb}" loading="lazy"><span class="badge">★ ${m.rating}</span></div><div class="c-info"><div class="c-title">${m.title}</div><div class="c-meta">${m.year || 'Кино'}</div></div>`;
        const img = el.querySelector('img');
        if (!m.poster) fixPoster(m, img);
        img.onerror = () => fixPoster(m, img);
        el.onmouseenter = () => sfx('tick');
        el.onclick = () => openCard(m);
        box.appendChild(el);
      });
    }

    async function doSearch(q) {
      $('status').style.display = 'block'; $('status').textContent = q ? `Ищем «${q}»...` : 'Загрузка...';
      const list = await queryCatalog(q);
      $('status').style.display = list.length ? 'none' : 'block';
      if (!list.length) $('status').textContent = 'Ничего не найдено.';
      renderGrid(list, $('grid-search'));
    }

    // 8. Отправка задач и Трекер
    $('dl-btn').onclick = async () => {
      if (!curMovie) return; sfx('pop'); addInterest(curMovie, 5);
      const isSer = $('serial-box').classList.contains('active');
      const payload = {
        action: "DOWNLOAD_MEDIA", title: curMovie.title, orig_title: curMovie.orig_title, year: curMovie.year,
        kp_id: curMovie.kp_id, imdb_id: curMovie.imdb_id, overview: curMovie.overview,
        voice: curGroup?.canon || '🎬 Дубляж (Официальный)', iframe_url: curSource?.iframe_url || '',
        quality: $('m-qual').value, format: $('m-fmt').value,
        download_mode: isSer ? dlScope : 'movie', season: curSeason, episodes: [...epSet],
        user_id: tgUid ? Number(tgUid) : null
      };
      locTasks.unshift({ title: `${payload.title} (${payload.voice})`, stage: 'Передано на сервер...' });
      store.set('vg_tasks', locTasks.slice(0, 15));

      if (srvOnline) {
        try {
          const r = await fetch(`${srvUrl}/api/webapp_task`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (r.ok) { closeModal(); return document.querySelector('[data-p="pane-tracker"]').click(); }
        } catch {}
      }
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOK}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAN_ID, text: `VG_TASK_JSON:${JSON.stringify(payload)}` }) });
        closeModal(); document.querySelector('[data-p="pane-tracker"]').click();
      } catch {}
    };

    async function pingServer() {
      if (location.protocol === 'https:' && srvUrl.startsWith('http://127.0.0.1')) {
        srvOnline = false; $('srv-dot').classList.remove('online'); return renderOfflineTracker();
      }
      try {
        const r = await fetch(`${srvUrl}/api/status`, { signal: AbortSignal.timeout(1600) });
        if (r.ok) {
          const d = await r.json(); srvOnline = true; $('srv-dot').classList.add('online');
          const entries = Object.entries(d.tasks || {});
          let h = entries.map(([id, t]) => `<div class="task-card"><div style="display:flex;justify-content:space-between;"><b>${t.title}</b><div><button class="pill" onclick="ctrlJob('${id}','${t.status==='paused'?'resume':'pause'}')">${t.status==='paused'?'▶':'⏸'}</button> <button class="pill" onclick="ctrlJob('${id}','cancel')">✕</button></div></div><div style="font-size:11px;color:var(--accent);margin-top:4px;">${t.stage} ${t.speed}</div><div class="bar"><div style="width:${t.progress||5}%"></div></div></div>`).join('');
          h += (d.history || []).map(x => `<div class="task-card"><div style="display:flex;justify-content:space-between;"><b>✅ ${x.title} (${x.quality})</b><span>${x.size}</span></div>${x.post_url?`<a href="${x.post_url}" target="_blank" style="font-size:11px;color:var(--accent);">🍿 Открыть в ТГК</a>`:''}</div>`).join('');
          $('tasks-box').innerHTML = h || `<div class="msg">Очередь ПК пуста.</div>`;
          return;
        }
      } catch {}
      srvOnline = false; $('srv-dot').classList.remove('online'); renderOfflineTracker();
    }

    function renderOfflineTracker() {
      $('tasks-box').innerHTML = locTasks.length ? locTasks.map(t => `<div class="task-card"><b>${t.title}</b><div style="font-size:11px;color:var(--accent);margin-top:4px;">📡 ${t.stage} (Прогресс в чате бота)</div></div>`).join('') : `<div class="msg">Активен облачный мост Telegram.</div>`;
    }
    window.ctrlJob = async (job_id, action) => { await fetch(`${srvUrl}/api/control`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({job_id, action}) }); pingServer(); };
    $('ping-btn').onclick = pingServer;
    $('clear-tasks').onclick = () => { locTasks = []; store.set('vg_tasks', []); pingServer(); };

    // 9. Рекомендации и Списки
    function addInterest(m, w) {
      if (!m?.title) return;
      const root = m.title.replace(/\(\d{4}\)/g, '').split(/[:—\-–.|]/)[0].replace(/\b(\d+|I|II|III|IV|V|Часть|Сезон|Фильм)\b.*$/i, '').trim();
      const ex = taste.find(x => x.root.toLowerCase() === root.toLowerCase());
      if (ex) { ex.score += w; ex.ts = Date.now(); } else taste.unshift({ root, genre: m.genre || 'фантастика', score: w, ts: Date.now() });
      taste.sort((a, b) => b.score - a.score || b.ts - a.ts);
      store.set('vg_taste', taste = taste.slice(0, 10));
    }

    async function renderRecs() {
      const box = $('shelves'); box.innerHTML = `<div class="msg">Подбираем полки...</div>`;
      const rows = taste.length ? [
        { t: `🎬 Франшиза и сиквелы: «${taste[0].root}»`, q: taste[0].root },
        ...(taste[1] ? [{ t: `🔥 Похожее: «${taste[1].root}»`, q: taste[1].root }] : []),
        { t: `✨ Лучшее в жанре: ${taste[0].genre}`, q: taste[0].genre }
      ] : [{ t: `🌌 Звёздные войны`, q: `Звёздные войны` }, { t: `🏆 Дюна`, q: `Дюна` }];
      box.innerHTML = '';
      for (const r of rows) {
        const items = await queryCatalog(r.q); if (!items.length) continue;
        const sec = document.createElement('div'); sec.style.marginBottom = '18px';
        sec.innerHTML = `<b style="font-size:14px;display:block;margin-bottom:8px;">${r.t}</b><div class="shelf-row"></div>`;
        renderGrid(items.slice(0, 10), sec.querySelector('.shelf-row'));
        box.appendChild(sec);
      }
    }
    $('reset-taste').onclick = () => { taste = []; store.set('vg_taste', []); renderRecs(); };

    function renderLists() {
      $('cnt-w').textContent = watchlist.length; $('cnt-d').textContent = watched.length;
      renderGrid(listMode === 'watch' ? watchlist : watched, $('grid-lists'));
    }
    $('tab-watch').onclick = () => { listMode = 'watch'; renderLists(); };
    $('tab-watched').onclick = () => { listMode = 'watched'; renderLists(); };
    $('add-w').onclick = () => { if (!curMovie) return; sfx('pop'); const i = watchlist.findIndex(x => x.title === curMovie.title); i >= 0 ? watchlist.splice(i, 1) : watchlist.unshift(curMovie); store.set('vg_watch', watchlist); renderLists(); };
    $('add-d').onclick = () => { if (!curMovie) return; sfx('pop'); const i = watched.findIndex(x => x.title === curMovie.title); i >= 0 ? watched.splice(i, 1) : watched.unshift(curMovie); store.set('vg_watched', watched); renderLists(); };

    let tmr; $('search-in').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => doSearch(e.target.value.trim()), 300); };
    pingServer(); doSearch('');
  </script>
</body>
