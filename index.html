<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VideoGrabber Cinema</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      padding-bottom: 30px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .status-msg {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 24px 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .rate-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .card-info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-sheet {
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 18px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-header { display: flex; gap: 12px; }
    .modal-poster {
      width: 80px;
      aspect-ratio: 2/3;
      border-radius: 8px;
      object-fit: cover;
      background: #1e293b;
    }
    .modal-titles h2 { font-size: 16px; margin-bottom: 4px; }
    .modal-titles p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .overview { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .control-row label { color: var(--text-muted); font-weight: 600; }
    .select-wrap { display: flex; gap: 6px; }
    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .action-btn {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .action-btn:active { background: var(--accent-hover); }
    .close-btn {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-badge">▶ VideoGrabber</div>
    <span style="font-size: 13px; font-weight: 600;">Удалённый пульт ПК</span>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Введите название фильма...">
  </div>

  <div id="status" class="status-msg">Загрузка популярных фильмов...</div>
  <div class="grid" id="movies-grid"></div>

  <!-- Модалка скачивания -->
  <div class="modal-overlay" id="modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <img src="" id="m-poster" class="modal-poster">
        <div class="modal-titles">
          <h2 id="m-title">Название</h2>
          <p id="m-dir">Озвучка / Качество: —</p>
          <p id="m-rates" style="color: #fbbf24; font-weight:600; margin-top:4px;">★ Рейтинг: —</p>
        </div>
      </div>

      <div class="overview" id="m-overview"></div>

      <div class="control-row">
        <label>Качество и формат:</label>
        <div class="select-wrap">
          <select id="m-quality">
            <option value="1080">1080p (Full HD)</option>
            <option value="720" selected>720p (TG Оптимально)</option>
            <option value="480">480p (Компактный)</option>
          </select>
          <select id="m-format">
            <option value="mp4" selected>MP4</option>
            <option value="mkv">MKV</option>
          </select>
        </div>
      </div>

      <div class="control-row">
        <label>Субтитры:</label>
        <select id="m-subs">
          <option value="soft">Вшить мягкой дорожкой (Softsubs)</option>
          <option value="hard">Вжечь в видео (Hardsub для ТГ)</option>
          <option value="none">Без субтитров</option>
        </select>
      </div>

      <button class="action-btn" id="send-task-btn">🚀 Отправить на скачивание в ПК</button>
      <div class="close-btn" id="close-modal-btn">Закрыть</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const KODIK_TOKEN = "0494164a3e824c4b4a68393cb5622014";
    let selectedMovie = null;

    const grid = document.getElementById('movies-grid');
    const statusEl = document.getElementById('status');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('modal');

    // Функция поиска по базе балансера
    async function searchMovies(query) {
      statusEl.style.display = 'block';
      statusEl.textContent = query ? `Поиск «${query}»...` : 'Загрузка подборки...';

      const url = query
        ? `https://kodikapi.com/search?token=${KODIK_TOKEN}&title=${encodeURIComponent(query)}&with_material_data=true&limit=30`
        : `https://kodikapi.com/list?token=${KODIK_TOKEN}&types=movie&sort=year&order=desc&with_material_data=true&limit=30`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const rawResults = data.results || [];

        // Убираем дубликаты одного и того же фильма с разными озвучками
        const unique = [];
        const seen = new Set();
        rawResults.forEach(item => {
          const key = (item.title || item.title_orig || '') + (item.year || '');
          if (!seen.has(key)) {
            seen.add(key);
            unique.push(item);
          }
        });

        if (unique.length === 0) {
          grid.innerHTML = '';
          statusEl.textContent = 'Ничего не найдено. Проверьте правильность названия.';
        } else {
          renderMovies(unique);
        }
      } catch (err) {
        statusEl.textContent = 'Ошибка сети. Проверьте соединение.';
      }
    }

    function renderMovies(movies) {
      grid.innerHTML = '';
      statusEl.style.display = 'none';

      movies.forEach(m => {
        const mat = m.material_data || {};
        const title = m.title || m.title_orig || 'Без названия';
        const year = m.year || mat.year || '';
        const poster = mat.poster_url || 'https://via.placeholder.com/300x450/1e293b/94a3b8?text=Нет+постера';
        const rate = mat.kinopoisk_rating || mat.imdb_rating || '—';

        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/1e293b/94a3b8?text=Обложка'">
            <span class="rate-badge">★ ${rate}</span>
          </div>
          <div class="card-info">
            <span class="card-title">${title}</span>
            <span class="card-meta">${year ? year + ' г.' : (m.type || 'Фильм')}</span>
          </div>
        `;

        card.addEventListener('click', () => openMovieDetail(m));
        grid.appendChild(card);
      });
    }

    function openMovieDetail(m) {
      selectedMovie = m;
      const mat = m.material_data || {};
      const poster = mat.poster_url || 'https://via.placeholder.com/300x450/1e293b/94a3b8?text=Обложка';
      const year = m.year || mat.year || '';
      const title = m.title || m.title_orig || 'Фильм';

      document.getElementById('m-poster').src = poster;
      document.getElementById('m-title').textContent = `${title} ${year ? '(' + year + ')' : ''}`;
      document.getElementById('m-overview').textContent = mat.description || 'Описание отсутствует.';

      const kp = mat.kinopoisk_rating ? `КП: ${mat.kinopoisk_rating}` : '';
      const imdb = mat.imdb_rating ? `IMDb: ${mat.imdb_rating}` : '';
      document.getElementById('m-rates').textContent = [kp, imdb].filter(Boolean).join(' • ') || 'Рейтинг уточняется';
      document.getElementById('m-dir').textContent = m.translation?.title ? `Озвучка: ${m.translation.title}` : 'Оригинал / Дубляж';

      modal.style.display = 'flex';
    }

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => searchMovies(e.target.value.trim()), 350);
    });

    // Отправка задания в бот
    document.getElementById('send-task-btn').addEventListener('click', () => {
      if (!selectedMovie || !tg) return;

      const mat = selectedMovie.material_data || {};
      const payload = {
        action: "DOWNLOAD_MOVIE",
        stream_link: selectedMovie.link,
        title: selectedMovie.title || selectedMovie.title_orig,
        orig_title: selectedMovie.title_orig || '',
        year: String(selectedMovie.year || mat.year || ''),
        overview: mat.description || '',
        rating: mat.kinopoisk_rating || mat.imdb_rating || '—',
        quality: document.getElementById('m-quality').value,
        format: document.getElementById('m-format').value,
        subs: document.getElementById('m-subs').value
      };

      tg.sendData(JSON.stringify(payload));
      tg.close();
    });

    // Стартовая подборка
    searchMovies('');
  </script>
</body>
</html>
