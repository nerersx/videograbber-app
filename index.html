<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VideoGrabber Cinema v3.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #1a2540;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
      --amber: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      padding-bottom: 84px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand-left { display: flex; align-items: center; gap: 10px; }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.35);
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--amber); display: inline-block;
    }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .key-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .settings-box {
      display: none;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      gap: 8px;
    }
    .settings-box.open { display: flex; }
    .settings-box label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .settings-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .settings-box button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 4px;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .status-msg {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 24px 10px;
      line-height: 1.5;
    }

    /* Сетка карточек */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 860px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .movie-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1e293b;
      position: relative;
      overflow: hidden;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rate-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .card-info { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 11px; color: var(--text-muted); }

    /* Горизонтальные полки Netflix для раздела "Для тебя" */
    .shelf-block { margin-bottom: 20px; }
    .shelf-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }
    .shelf-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .shelf-row::-webkit-scrollbar { display: none; }
    .shelf-row .movie-card {
      min-width: 135px;
      max-width: 135px;
      flex-shrink: 0;
    }

    /* Чипсы */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Модалка фильма + плеер + выбор серий */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.86);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-sheet {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      max-height: 92vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-header { display: flex; gap: 12px; }
    .modal-poster {
      width: 80px;
      aspect-ratio: 2/3;
      border-radius: 8px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }
    .modal-titles { flex: 1; }
    .modal-titles h2 { font-size: 15.5px; margin-bottom: 3px; }
    .modal-titles p { font-size: 11.5px; color: var(--text-muted); line-height: 1.35; }

    /* Переключатель Смотреть онлайн / Скачать */
    .mode-switch {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-hover);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3);
    }

    /* Контейнер онлайн-плеера */
    .player-wrap {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .player-wrap.active { display: block; }
    .player-wrap iframe { width: 100%; height: 100%; border: none; }

    .control-row { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    .control-row label { color: var(--text-muted); font-weight: 600; }
    .select-wrap { display: flex; gap: 6px; }
    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
    }

    /* Блок выбора сезона и серий для сериалов */
    .serial-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
    }
    .serial-box.active { display: flex; }
    .dl-scope-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .scope-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .scope-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      max-height: 115px;
      overflow-y: auto;
      padding-top: 2px;
    }
    .ep-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .ep-chip.selected {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 800;
    }

    .action-btn {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      padding: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .close-btn {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding: 4px;
      cursor: pointer;
    }

    /* Карточка задачи в Трекере */
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .task-title { font-size: 13px; font-weight: 700; }
    .task-ctrl-btns { display: flex; gap: 5px; }
    .mini-ctrl {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .task-bar {
      width: 100%; height: 6px; background: var(--bg);
      border-radius: 4px; overflow: hidden; margin-top: 6px;
    }
    .task-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.4s;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(19, 27, 46, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px 12px;
      z-index: 90;
    }
    .nav-item {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 11px; font-weight: 600; display: flex; flex-direction: column;
      align-items: center; gap: 3px; cursor: pointer; position: relative;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 17px; }
  </style>
</head>
<body>

  <header>
    <div class="brand-left">
      <div class="logo-badge">▶ VideoGrabber</div>
      <span style="font-size: 13px; font-weight: 700;">Cinema v3.0</span>
      <span class="conn-dot" id="srv-dot" title="Статус гибридного моста"></span>
    </div>
    <button class="key-btn" id="toggle-settings-btn">⚙️ Мост и ключи</button>
  </header>

  <!-- Настройки гибридного моста -->
  <div class="settings-box" id="settings-box">
    <label>🌐 Адрес сервера ПК (локальный или Cloudflare HTTPS-туннель):</label>
    <input type="text" id="srv-url-input" placeholder="http://127.0.0.1:8765 или https://xxxx.trycloudflare.com">
    <label>👤 Твой Telegram ID (для дублирования фильмов в ЛС при заказе из браузера):</label>
    <input type="text" id="tg-uid-input" placeholder="Например: 123456789 (или напиши /start боту)">
    <label>🔑 API-ключ Кинопоиска (kinopoiskapiunofficial.tech):</label>
    <input type="text" id="kp-key-input" placeholder="По умолчанию уже встроен">
    <button id="save-settings-btn">Сохранить настройки</button>
  </div>

  <!-- ВКЛАДКА 1: Поиск -->
  <div class="tab-pane active" id="pane-search">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск фильма или сериала (Звёздные войны, Дюна)...">
    </div>
    <div id="status" class="status-msg">Загрузка популярных фильмов...</div>
    <div class="grid" id="movies-grid"></div>
  </div>

  <!-- ВКЛАДКА 2: Умные рекомендации (Полки по весам интересов) -->
  <div class="tab-pane" id="pane-recs">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:12.5px; color:var(--text-muted);" id="taste-profile-label">Нажми на любой фильм, чтобы обучить рекомендации</span>
      <button class="key-btn" id="reset-taste-btn">Сбросить вкус</button>
    </div>
    <div id="recs-shelves"></div>
  </div>

  <!-- ВКЛАДКА 3: Списки и Letterboxd -->
  <div class="tab-pane" id="pane-lists">
    <div class="chips-row">
      <button class="chip active" id="btn-show-watchlist">🔖 Хочу посмотреть (<span id="cnt-watch">0</span>)</button>
      <button class="chip" id="btn-show-watched">👁 История и просмотрено (<span id="cnt-watched">0</span>)</button>
    </div>
    <div id="lists-empty" class="status-msg">Список пуст.</div>
    <div class="grid" id="lists-grid"></div>
  </div>

  <!-- ВКЛАДКА 4: Живой трекер закачек -->
  <div class="tab-pane" id="pane-tracker">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:13px; font-weight:700;">📡 Активные загрузки и очередь ТГК</span>
      <button class="key-btn" id="clear-tasks-btn">Очистить локальные</button>
    </div>
    <div id="tasks-container"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: ОНЛАЙН-ПЛЕЕР + СКАЧИВАНИЕ В ТГК -->
  <div class="modal-overlay" id="modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <img src="" id="m-poster" class="modal-poster">
        <div class="modal-titles">
          <h2 id="m-title">Название</h2>
          <p id="m-dir">Режиссёр / Тип</p>
          <p id="m-rates" style="color: #fbbf24; font-weight:600; margin-top:3px;">★ Рейтинг</p>
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="key-btn" id="m-add-watch" style="flex:1;">🔖 В список</button>
            <button class="key-btn" id="m-add-watched" style="flex:1;">👁 Смотрел</button>
          </div>
        </div>
      </div>

      <!-- Переключатель: Смотреть онлайн прямо сейчас ИЛИ Скачать в ТГК -->
      <div class="mode-switch">
        <button class="mode-btn active" id="tab-mode-dl">🚀 Скачать в ТГК и ЛС</button>
        <button class="mode-btn" id="tab-mode-watch">▶️ Смотреть онлайн</button>
      </div>

      <!-- Встроенный онлайн-плеер Kodik -->
      <div class="player-wrap" id="online-player-wrap">
        <iframe id="kodik-iframe" src="" allowfullscreen allow="autoplay *; fullscreen *"></iframe>
      </div>

      <div class="control-row">
        <label id="voice-status-lbl">🎙 Доступные озвучки в базе Kodik:</label>
        <select id="m-voice"></select>
      </div>

      <!-- Блок выбора сезонов и серий (появляется автоматически для сериалов) -->
      <div class="serial-box" id="serial-box">
        <div class="control-row">
          <label>📺 Выберите сезон:</label>
          <select id="m-season"></select>
        </div>

        <div class="control-row" id="dl-scope-wrap">
          <label>📦 Что именно скачиваем:</label>
          <div class="dl-scope-btns">
            <button class="scope-btn active" data-scope="selected">Выбрать серии</button>
            <button class="scope-btn" data-scope="season">Весь сезон</button>
            <button class="scope-btn" data-scope="all_seasons">Весь сериал</button>
          </div>
        </div>

        <div class="control-row" id="ep-picker-wrap">
          <label id="ep-picker-lbl">Отметьте серии (клик для выбора):</label>
          <div class="ep-grid" id="ep-grid"></div>
        </div>
      </div>

      <!-- Настройки контейнера и качества для скачивания -->
      <div id="dl-options-wrap" style="display:flex; flex-direction:column; gap:8px;">
        <div class="control-row">
          <label>⚙️ Качество и формат файла:</label>
          <div class="select-wrap">
            <select id="m-quality">
              <option value="1080">1080p (Full HD)</option>
              <option value="720" selected>720p (Оптимально для ТГ)</option>
              <option value="480">480p (Быстро)</option>
            </select>
            <select id="m-format">
              <option value="mp4" selected>MP4 (Стриминг iOS/Android)</option>
              <option value="mkv">MKV</option>
            </select>
          </div>
        </div>
        <button class="action-btn" id="send-task-btn">🚀 Скачать в ТГК + прислать мне в ЛС</button>
      </div>

      <div class="close-btn" id="close-modal-btn">Закрыть окно</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-pane="pane-search"><span class="nav-icon">🔍</span><span>Поиск</span></button>
    <button class="nav-item" data-pane="pane-recs"><span class="nav-icon">✨</span><span>Для тебя</span></button>
    <button class="nav-item" data-pane="pane-lists"><span class="nav-icon">📌</span><span>Списки</span></button>
    <button class="nav-item" data-pane="pane-tracker"><span class="nav-icon">📊</span><span>Загрузки</span></button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Встроенные ключи для автономной работы и облачного моста
    const DEFAULT_KP_KEY = "499be78a-5444-4620-b192-b8888fcb7143";
    const KODIK_PUBLIC_TOKEN = "0494164a3e824c4b4a68393cb5622014";
    const CLOUD_BOT_TOKEN = "9127267176:AAHPmwAUw5H_dQPiCsZqLoRisA_-pGnw6as";
    const CLOUD_CHANNEL_ID = "-1004332808314";

    let serverUrl = localStorage.getItem('vg_srv_url') || 'http://127.0.0.1:8765';
    let kpApiKey = localStorage.getItem('vg_kp_key') || DEFAULT_KP_KEY;
    let userTgId = localStorage.getItem('vg_tg_uid') || (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '');

    let watchlist = JSON.parse(localStorage.getItem('vg_watchlist') || '[]');
    let watched = JSON.parse(localStorage.getItem('vg_watched') || '[]');
    let tasteHistory = JSON.parse(localStorage.getItem('vg_taste_v3') || '[]');
    let localTasks = JSON.parse(localStorage.getItem('vg_tasks_v3') || '[]');

    let selectedMovie = null;
    let currentKodikItems = [];
    let currentVoiceItem = null;
    let selectedDownloadScope = 'selected';
    let selectedEpisodesSet = new Set(['1']);
    let isWatchOnlineMode = false;
    let serverReachable = false;

    document.getElementById('srv-url-input').value = serverUrl;
    document.getElementById('kp-key-input').value = kpApiKey;
    document.getElementById('tg-uid-input').value = userTgId;

    // Навигация по вкладкам
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item, .tab-pane').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.pane).classList.add('active');
        if (btn.dataset.pane === 'pane-recs') renderSmartRecommendations();
        if (btn.dataset.pane === 'pane-lists') renderSavedLists();
        if (btn.dataset.pane === 'pane-tracker') pollServerStatus();
      });
    });

    document.getElementById('toggle-settings-btn').addEventListener('click', () => {
      document.getElementById('settings-box').classList.toggle('open');
    });

    document.getElementById('save-settings-btn').addEventListener('click', () => {
      serverUrl = document.getElementById('srv-url-input').value.trim().replace(/\/$/, '') || 'http://127.0.0.1:8765';

    // === 1. ИСПРАВЛЕННЫЙ ФИЛЬТР ПОСТЕРОВ (Отсекает заглушки no-poster Кинопоиска) ===
    function isBadPosterUrl(url) {
      if (!url || typeof url !== 'string') return true;
      const lower = url.toLowerCase();
      return lower.includes('no-poster') || lower.includes('noposter') || lower.includes('empty') || lower.includes('placeholder');
    }

    async function resolveMissingPoster(title, origTitle, year, imgEl) {
      const queries = [origTitle, title].filter(Boolean);
      for (const qText of queries) {
        try {
          const q = `${qText} ${year || ''}`.trim();
          const res = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(q)}`);
          if (res.ok) {
            const data = await res.json();
            const found = (data.description || []).find(item => item['#IMG_POSTER'] && !isBadPosterUrl(item['#IMG_POSTER']));
            if (found) {
              imgEl.src = found['#IMG_POSTER'];
              return found['#IMG_POSTER'];
            }
          }
        } catch (e) {}
      }
      return null;
    }

    // === 2. ПОИСК ФИЛЬМОВ И СЕРИАЛОВ (Кинопоиск + iTunes + IMDb) ===
    async function fetchMoviesByQuery(query) {
      const results = [];
      const seen = new Set();

      // А. Поиск через Кинопоиск API
      if (kpApiKey) {
        try {
          const url = query
            ? `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}`
            : `https://kinopoiskapiunofficial.tech/api/v2.2/films/collections?type=TOP_POPULAR_ALL&page=1`;
          const res = await fetch(url, { headers: { 'X-API-KEY': kpApiKey, 'Content-Type': 'application/json' } });
          if (res.ok) {
            const data = await res.json();
            (data.films || data.items || []).forEach(f => {
              const title = f.nameRu || f.nameEn || f.nameOriginal || '';
              if (!title) return;
              const year = String(f.year || '');
              const key = `${title}_${year}`.toLowerCase();
              if (seen.has(key)) return;
              seen.add(key);

              const rawPoster = f.posterUrlPreview || f.posterUrl || '';
              const genres = (f.genres || []).map(g => g.genre).slice(0, 2);
              results.push({
                id: String(f.filmId || f.kinopoiskId || ''),
                kp_id: String(f.filmId || f.kinopoiskId || ''),
                imdb_id: String(f.imdbId || ''),
                title: title,
                orig_title: f.nameEn || f.nameOriginal || title,
                year: year,
                poster: isBadPosterUrl(rawPoster) ? '' : rawPoster,
                rating: (f.rating && f.rating !== 'null') ? f.rating : (f.ratingKinopoisk || 'HD'),
                genres: genres,
                director: genres.join(', ') || 'Кино и сериалы',
                overview: f.description || 'Описание и рейтинги КП / IMDb / Letterboxd автоматически добавятся при скачивании.'
              });
            });
          }
        } catch (e) {}
      }

      // Б. Если результатов мало или нет постеров — дополняем из глобального IMDb API
      if (results.length < 6 && query) {
        try {
          const imdbRes = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(query)}`);
          if (imdbRes.ok) {
            const imdbData = await imdbRes.json();
            (imdbData.description || []).slice(0, 10).forEach(item => {
              const title = item['#TITLE'] || '';
              const year = String(item['#YEAR'] || '');
              const key = `${title}_${year}`.toLowerCase();
              if (title && !seen.has(key)) {
                seen.add(key);
                results.push({
                  id: item['#IMDB_ID'] || title,
                  kp_id: '',
                  imdb_id: item['#IMDB_ID'] || '',
                  title: title,
                  orig_title: title,
                  year: year,
                  poster: item['#IMG_POSTER'] || '',
                  rating: 'IMDb',
                  genres: [],
                  director: item['#ACTORS'] || 'IMDb Global',
                  overview: `В ролях: ${item['#ACTORS'] || '—'}`
                });
              }
            });
          }
        } catch (e) {}
      }
      return results;
    }

    async function searchMovies(query) {
      const statusEl = document.getElementById('status');
      const grid = document.getElementById('movies-grid');
      statusEl.style.display = 'block';
      statusEl.textContent = query ? `Ищем «${query}»...` : 'Загрузка каталога...';

      const list = await fetchMoviesByQuery(query);
      if (!list.length) {
        grid.innerHTML = '';
        statusEl.textContent = 'Ничего не найдено.';
      } else {
        statusEl.style.display = 'none';
        renderMoviesToGrid(list, grid);
      }
    }

    function renderMoviesToGrid(movies, targetEl) {
      targetEl.innerHTML = '';
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        const fallbackSvg = `https://placehold.co/300x450/131b2e/38bdf8?text=${encodeURIComponent(m.title.slice(0, 16))}`;
        const validPoster = (!isBadPosterUrl(m.poster)) ? m.poster : '';

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${validPoster || fallbackSvg}" loading="lazy" alt="${m.title}">
            <span class="rate-badge">★ ${m.rating || 'HD'}</span>
          </div>
          <div class="card-info">
            <span class="card-title">${m.title}</span>
            <span class="card-meta">${m.year ? m.year + ' г.' : 'Тайтл'}</span>
          </div>
        `;

        const imgEl = card.querySelector('img');
        if (!validPoster) {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => { if (u) m.poster = u; });
        }
        imgEl.addEventListener('error', () => {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => {
            if (!u) imgEl.src = fallbackSvg;
          });
        }, { once: true });

        card.addEventListener('click', () => openMovieDetail(m));
        targetEl.appendChild(card);
      });
    }

    // === 3. СИСТЕМА УМНЫХ РЕКОМЕНДАЦИЙ (Обучение по кликам, просмотрам и франшизам) ===
    function extractFranchiseRoot(title) {
      return title
        .replace(/\(\d{4}\)/g, '')
        .split(/[:—\-–.|]/)[0]
        .replace(/\b(\d+|I|II|III|IV|V|VI|VII|VIII|IX|X|Часть|Сезон|Фильм|Эпизод)\b.*$/i, '')
        .trim();
    }

    function recordUserInterest(movie, weight = 1) {
      if (!movie || !movie.title) return;
      const root = extractFranchiseRoot(movie.title);
      const existing = tasteHistory.find(x => x.root.toLowerCase() === root.toLowerCase());
      if (existing) {
        existing.score += weight;
        existing.lastTitle = movie.title;
        existing.genre = (movie.genres && movie.genres[0]) || existing.genre;
        existing.ts = Date.now();
      } else {
        tasteHistory.unshift({
          root: root,
          lastTitle: movie.title,
          orig: movie.orig_title || '',
          genre: (movie.genres && movie.genres[0]) || 'фантастика',
          score: weight,
          ts: Date.now()
        });
      }
      tasteHistory.sort((a, b) => b.score - a.score || b.ts - a.ts);
      tasteHistory = tasteHistory.slice(0, 12);
      localStorage.setItem('vg_taste_v3', JSON.stringify(tasteHistory));
    }

      const shelvesToLoad = [];
      if (tasteHistory.length > 0) {
        const top1 = tasteHistory[0];
        label.textContent = `Твой топ-интерес: «${top1.root}» (${top1.score} балл.)`;
        shelvesToLoad.push({
          title: `🎬 Франшиза, сиквелы и спин-оффы: «${top1.root}»`,
          query: top1.root
        });
        if (tasteHistory[1]) {
          shelvesToLoad.push({
            title: `🔥 Похожее и другие части: «${tasteHistory[1].root}»`,
            query: tasteHistory[1].root
          });
        }
        shelvesToLoad.push({
          title: `✨ В твоем любимом жанре (${top1.genre})`,
          query: top1.genre
        });
      } else {
        label.textContent = `Кликни на любой фильм или скачай его, чтобы полки подстроились под тебя`;
        shelvesToLoad.push(
          { title: `🌌 Культовые вселенные: Звёздные войны`, query: `Звёздные войны` },
          { title: `🍋 Эстетика и фестивальное кино`, query: `Назови меня своим именем` }
        );
      }

      container.innerHTML = '';
      for (const sh of shelvesToLoad) {
        const items = await fetchMoviesByQuery(sh.query);
        if (!items.length) continue;
        const block = document.createElement('div');
        block.className = 'shelf-block';
        block.innerHTML = `
          <div class="shelf-title"><span>${sh.title}</span></div>
          <div class="shelf-row"></div>
        `;
        renderMoviesToGrid(items.slice(0, 10), block.querySelector('.shelf-row'));
        container.appendChild(block);
      }
    }

    async function loadRealKodikTranslations(m) {
      const voiceSelect = document.getElementById('m-voice');
      const voiceLbl = document.getElementById('voice-status-lbl');
      const serialBox = document.getElementById('serial-box');

      voiceLbl.textContent = '⏳ Проверяем доступные озвучки и серии в базе Kodik...';
      voiceSelect.innerHTML = `<option value="Любая">Загрузка озвучек...</option>`;
      serialBox.classList.remove('active');
      currentKodikItems = [];

      const cleanTitle = m.title.replace(/\(\d{4}\)/g, '').trim();
      const urls = [];
      if (m.kp_id && /^\d+$/.test(m.kp_id)) {
        urls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&kinopoisk_id=${m.kp_id}&with_episodes=true`);
      }
      if (m.imdb_id && m.imdb_id.startsWith('tt')) {
        urls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&imdb_id=${m.imdb_id}&with_episodes=true`);
      }
      urls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&title=${encodeURIComponent(cleanTitle)}&with_episodes=true`);
      if (m.orig_title && m.orig_title !== cleanTitle) {
        urls.push(`https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&title=${encodeURIComponent(m.orig_title)}&with_episodes=true`);
      }

      for (const u of urls) {
        try {
          const r = await fetch(u);
          const data = await r.json();
          if (data.results && data.results.length > 0) {
            currentKodikItems = data.results;
            break;
          }
        } catch (e) {}
      }

      if (m.year && currentKodikItems.length > 1) {
        const byYear = currentKodikItems.filter(x => String(x.year) === String(m.year));
        if (byYear.length > 0) currentKodikItems = byYear;
      }

      if (currentKodikItems.length === 0) {
        voiceLbl.textContent = '⚠️ В базе Kodik точных раздач не найдено (попробуем автопоиск на ПК):';
        voiceSelect.innerHTML = `<option value="Любая">⚡ Автовыбор на сервере</option>`;
        return;
      }

      // Оставляем уникальные реальные озвучки этого фильма/сериала
      const uniqueVoices = [];
      const seenTr = new Set();
      currentKodikItems.forEach(item => {
        const trTitle = item.translation?.title || 'Оригинал / Стандартная';
        if (!seenTr.has(trTitle)) {
          seenTr.add(trTitle);
          uniqueVoices.push({ title: trTitle, item: item });
        }
      });

      voiceLbl.textContent = `🎙 Найдено реальных озвучек (${uniqueVoices.length}):`;
      voiceSelect.innerHTML = uniqueVoices.map((v, idx) =>
        `<option value="${v.title}" data-idx="${idx}">${v.title} (${v.item.quality || 'HD'})</option>`
      ).join('');

      currentVoiceItem = uniqueVoices[0].item;
      voiceSelect.onchange = () => {
        const found = uniqueVoices.find(v => v.title === voiceSelect.value);
        if (found) {
          currentVoiceItem = found.item;
          renderSeasonsAndEpisodes(currentVoiceItem);
          if (isWatchOnlineMode) updateOnlineIframe();
        }
      };

      renderSeasonsAndEpisodes(currentVoiceItem);
    }

    function renderSeasonsAndEpisodes(kodikItem) {
      const serialBox = document.getElementById('serial-box');
      const seasonSelect = document.getElementById('m-season');
      const seasonsObj = kodikItem?.seasons;

      if (!seasonsObj || Object.keys(seasonsObj).length === 0) {
        serialBox.classList.remove('active');
        return;
      }

      serialBox.classList.add('active');
      const seasonKeys = Object.keys(seasonsObj).sort((a, b) => Number(a) - Number(b));
      seasonSelect.innerHTML = seasonKeys.map(s => {
        const epCount = Object.keys(seasonsObj[s].episodes || {}).length;
        return `<option value="${s}">Сезон ${s} (${epCount} сер.)</option>`;
      }).join('');

      seasonSelect.onchange = () => renderEpisodeChips(seasonsObj[seasonSelect.value]);
      renderEpisodeChips(seasonsObj[seasonKeys[0]]);
    }

    function renderEpisodeChips(seasonData) {
      const epGrid = document.getElementById('ep-grid');
      const episodesObj = seasonData?.episodes || {};
      const epNums = Object.keys(episodesObj).sort((a, b) => Number(a) - Number(b));

      selectedEpisodesSet = new Set([epNums[0] || '1']);
      epGrid.innerHTML = epNums.map(ep => `
        <div class="ep-chip ${ep === epNums[0] ? 'selected' : ''}" data-ep="${ep}">Сер. ${ep}</div>
      `).join('');

      epGrid.querySelectorAll('.ep-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const ep = chip.dataset.ep;
          if (isWatchOnlineMode) {
            selectedEpisodesSet = new Set([ep]);
            epGrid.querySelectorAll('.ep-chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            updateOnlineIframe();
          } else {
            if (selectedEpisodesSet.has(ep) && selectedEpisodesSet.size > 1) {
              selectedEpisodesSet.delete(ep);
              chip.classList.remove('selected');
            } else {
              selectedEpisodesSet.add(ep);
              chip.classList.add('selected');
            }
          }
        });
      });

      if (isWatchOnlineMode) updateOnlineIframe();
    }

    // Переключение режима скачивания сериала (Выбранные серии / Весь сезон / Весь сериал)
    document.querySelectorAll('.scope-btn').forEach(btn => {

      });
    });

    function updateOnlineIframe() {
      const iframe = document.getElementById('kodik-iframe');
      if (!currentVoiceItem) return;

      let targetLink = currentVoiceItem.link || '';
      const seasonNum = document.getElementById('m-season').value;
      const firstEp = Array.from(selectedEpisodesSet)[0] || '1';

      if (currentVoiceItem.seasons && currentVoiceItem.seasons[seasonNum]?.episodes?.[firstEp]) {
        const epData = currentVoiceItem.seasons[seasonNum].episodes[firstEp];
        targetLink = typeof epData === 'string' ? epData : (epData.link || targetLink);
      }
      if (targetLink.startsWith('//')) targetLink = 'https:' + targetLink;
      iframe.src = targetLink;

      // КАНАЛ 1: Прямой запрос на сервер (если доступен локально или через Cloudflare HTTPS-туннель)
      try {

        if (res.ok) {

      try {
        const tgRes = await fetch(`https://api.telegram.org/bot${CLOUD_BOT_TOKEN}/sendMessage`, {
          method: 'POST',

            chat_id: CLOUD_CHANNEL_ID,

      } catch (e) {}

        tg.sendData(JSON.stringify(payload));
        tg.close();
      }

    // === 6. ЖИВОЙ ТРЕКЕР ЗАКАЧЕК С ПАУЗОЙ И ОТМЕНОЙ ===
    async function pollServerStatus() {
      const dot = document.getElementById('srv-dot');
      try {
        const res = await fetch(`${serverUrl}/api/status`, { signal: AbortSignal.timeout(2500) });
        if (res.ok) {
          const data = await res.json();
          serverReachable = true;
          dot.classList.add('online');
          renderTrackerFromServer(data.tasks || {}, data.history || []);
          return;
        }
      } catch (e) {
        serverReachable = false;
        dot.classList.remove('online');
      }
      renderTrackerOffline();
    }

    async function sendJobControl(jobId, action) {
      try {
        await fetch(`${serverUrl}/api/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_id: jobId, action: action })
        });
        pollServerStatus();
      } catch (e) {}
    }

    function renderTrackerFromServer(tasksObj, historyList) {
      const container = document.getElementById('tasks-container');
      const entries = Object.entries(tasksObj);
      if (entries.length === 0 && historyList.length === 0) {
        container.innerHTML = `<div class="status-msg">Активных загрузок на ПК сейчас нет.</div>`;
        return;
      }

      let html = entries.map(([jid, t]) => `
        <div class="task-card">
          <div class="task-top">
            <span class="task-title">${t.title}</span>
            <div class="task-ctrl-btns">
              ${t.status === 'paused'
                ? `<button class="mini-ctrl" onclick="sendJobControl('${jid}','resume')">▶ Пуск</button>`
                : `<button class="mini-ctrl" onclick="sendJobControl('${jid}','pause')">⏸ Пауза</button>`}
              <button class="mini-ctrl" style="color:var(--danger);" onclick="sendJobControl('${jid}','cancel')">✕ Отмена</button>
            </div>
          </div>
          <div style="font-size:11.5px; color:var(--accent);">${t.stage} ${t.speed ? '• ' + t.speed : ''}</div>
          <div class="task-bar"><div class="task-bar-fill" style="width:${t.progress || 5}%;"></div></div>
        </div>
      `).join('');

      if (historyList.length > 0) {
        html += `<div style="font-size:12px; font-weight:700; margin:12px 0 8px; color:var(--text-muted);">✅ Выгружено в ТГК и удалено с ПК:</div>`;
        html += historyList.map(h => `
          <div class="task-card" style="opacity:0.85;">
            <div class="task-top">
              <span class="task-title">${h.title}</span>
              <span style="font-size:11px; color:var(--green);">${h.size}</span>
            </div>
            ${h.post_url ? `<a href="${h.post_url}" target="_blank" style="font-size:11.5px; color:var(--accent);">🍿 Открыть пост в закрытом ТГК</a>` : ''}
          </div>
        `).join('');
      }
      container.innerHTML = html;
    }

    function renderTrackerOffline() {
      const container = document.getElementById('tasks-container');
      if (!localTasks.length) {
        container.innerHTML = `<div class="status-msg">Задачи передаются через облачный мост Telegram. Прогресс-бар отображается прямо в чате бота!</div>`;
        return;
      }
      container.innerHTML = localTasks.map(t => `
        <div class="task-card">
          <div class="task-title">${t.title}</div>
          <div style="font-size:11.5px; color:var(--accent); margin-top:4px;">📡 Передано через облачный мост → смотри живой прогресс-бар в Telegram!</div>
        </div>
      `).join('');
    }

    document.getElementById('clear-tasks-btn').addEventListener('click', () => {
      localTasks = [];
      localStorage.setItem('vg_tasks_v3', '[]');
      pollServerStatus();
    });

    // Списки желаемого и просмотренного
    let currentListMode = 'watchlist';
    function renderSavedLists() {
      document.getElementById('cnt-watch').textContent = watchlist.length;
      document.getElementById('cnt-watched').textContent = watched.length;
      const src = currentListMode === 'watchlist' ? watchlist : watched;
      const grid = document.getElementById('lists-grid');
      const empty = document.getElementById('lists-empty');
      if (!src.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        renderMoviesToGrid(src, grid);
      }
    }

    document.getElementById('btn-show-watchlist').addEventListener('click', (e) => {
      currentListMode = 'watchlist';
      e.target.classList.add('active');
      document.getElementById('btn-show-watched').classList.remove('active');
      renderSavedLists();
    });
    document.getElementById('btn-show-watched').addEventListener('click', (e) => {
      currentListMode = 'watched';
      e.target.classList.add('active');
      document.getElementById('btn-show-watchlist').classList.remove('active');
      renderSavedLists();
    });

    document.getElementById('m-add-watch').addEventListener('click', () => {
      if (!selectedMovie) return;
      const i = watchlist.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watchlist.splice(i, 1); else watchlist.unshift(selectedMovie);
      localStorage.setItem('vg_watchlist', JSON.stringify(watchlist));
      renderSavedLists();
    });
    document.getElementById('m-add-watched').addEventListener('click', () => {
      if (!selectedMovie) return;
      const i = watched.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watched.splice(i, 1); else watched.unshift(selectedMovie);
      localStorage.setItem('vg_watched', JSON.stringify(watched));
      renderSavedLists();
    });

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => searchMovies(e.target.value.trim()), 350);
    });

    setInterval(pollServerStatus, 3500);
    pollServerStatus();
    searchMovies('');
  </script>
</body>
</html>
