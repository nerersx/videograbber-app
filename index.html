<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CleanYourTV OS • VideoGrabber v5.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #070b14;
      --glass: rgba(19, 27, 46, 0.78);
      --glass-strong: rgba(15, 23, 42, 0.94);
      --card-bg: #11192c;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.55);
      --green: #22c55e;
      --amber: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --macos-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #13203d 0%, var(--bg) 70%);
      color: var(--text);
      padding: 14px 16px 105px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === ВЕРХНИЙ СТАТУС-БАР CLEANYOURTV OS === */
    .tv-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      max-width: 1180px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .os-brand { display: flex; align-items: center; gap: 10px; }
    .os-logo {
      background: linear-gradient(135deg, #00d2ff, #2563eb);
      color: #fff;
      font-weight: 900;
      font-size: 12.5px;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0, 210, 255, 0.4);
    }
    .os-title { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; }
    .os-status-right { display: flex; align-items: center; gap: 10px; }
    .os-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .os-pill:hover { transform: scale(1.06); background: rgba(255,255,255,0.12); }
    .os-pill:active { transform: scale(0.95); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .os-clock { font-size: 13px; font-weight: 800; color: #e2e8f0; font-variant-numeric: tabular-nums; }

    /* Панель настроек OS */
    .settings-drawer {
      display: none;
      flex-direction: column;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 18px;
      margin: 0 auto 18px;
      max-width: 1180px;
      gap: 10px;
      animation: switchPop 0.28s var(--spring);
    }
    .settings-drawer.open { display: flex; }
    .settings-row { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 700px) { .settings-row { grid-template-columns: repeat(3, 1fr); } }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group label { font-size: 11px; color: var(--text-muted); font-weight: 700; }
    .field-group input {
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      outline: none;
    }
    .field-group input:focus { border-color: var(--accent); }

    /* Вкладки контента */
    .main-container { max-width: 1180px; margin: 0 auto; }
    .tab-pane { display: none; animation: fadeUp 0.3s var(--macos-ease); }
    .tab-pane.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes switchPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Поиск в стиле Spotlight macOS */
    .search-box {
      position: relative;
      margin-bottom: 18px;
    }
    .search-box input {
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15.5px;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 16px;
      outline: none;
      transition: all 0.25s var(--spring);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.25), 0 12px 30px rgba(0,0,0,0.4);
      transform: scale(1.008);
    }

    .status-msg {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-muted);
      padding: 32px 12px;
    }

    /* === СЕТКА КАРТОЧЕК С АНИМАЦИЕЙ NINTENDO SWITCH === */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
    @media (min-width: 980px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 20px; } }

    .movie-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.28s var(--spring), border-color 0.2s, box-shadow 0.28s var(--macos-ease);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .movie-card:hover, .movie-card.tv-focused {
      transform: translateY(-6px) scale(1.045);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), 0 16px 32px rgba(0,0,0,0.6);
      z-index: 5;
    }
    .movie-card:active { transform: scale(0.96); }

    @keyframes switchPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.65), 0 16px 32px rgba(0,0,0,0.6); }
      50% { box-shadow: 0 0 0 6px rgba(0, 210, 255, 0.25), 0 16px 32px rgba(0,0,0,0.6); }
    }
    .movie-card.tv-focused { animation: switchPulse 1.6s infinite ease-in-out; }

    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #162038;
      position: relative;
      overflow: hidden;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rate-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(6px);
      color: #fbbf24;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-info { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }

    /* Полки рекомендаций */
    .shelf-block { margin-bottom: 24px; }
    .shelf-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: #f1f5f9; }
    .shelf-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 8px 4px 14px;
      scrollbar-width: none;
    }
    .shelf-row::-webkit-scrollbar { display: none; }
    .shelf-row .movie-card { min-width: 150px; max-width: 150px; flex-shrink: 0; }

    /* === ПАРЯЩИЙ DOCK В СТИЛЕ MACOS === */
    .macos-dock-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 90;
      pointer-events: none;
    }
    .macos-dock {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 14px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65);
    }
    .dock-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.25s var(--spring), background 0.2s, color 0.2s;
      position: relative;
    }
    .dock-item:hover {
      transform: translateY(-6px) scale(1.14);
      color: var(--text);
      background: rgba(255,255,255,0.07);
    }
    .dock-item.active {
      color: var(--accent);
      background: rgba(0, 210, 255, 0.14);
    }
    .dock-item.active::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .dock-icon { font-size: 19px; line-height: 1; }

    /* === МОДАЛЬНОЕ ОКНО С ФИЗИКОЙ SWIPE-TO-CLOSE И FULLSCREEN === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 15, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 120;
    }
    @media (min-width: 768px) {
      .modal-overlay { align-items: center; padding: 20px; }
    }

    .modal-sheet {
      width: 100%;
      max-width: 720px;
      background: var(--glass-strong);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 26px 26px 0 0;
      padding: 10px 18px 22px;
      max-height: 82vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      box-shadow: 0 -12px 48px rgba(0,0,0,0.75);
      transition: transform 0.32s var(--macos-ease), max-height 0.32s var(--macos-ease), border-radius 0.25s;
      will-change: transform, max-height;
    }
    .modal-sheet.fullscreen {
      max-height: 98vh;
      height: 98vh;
      border-radius: 18px 18px 0 0;
    }
    @media (min-width: 768px) {
      .modal-sheet {
        border-radius: 26px;
        max-height: 90vh;
        padding: 18px 24px 24px;
        animation: switchPop 0.3s var(--spring);
      }
    }

    /* Верхняя ручка свайпа + Кнопки Fullscreen и Закрытия */
    .sheet-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 6px;
      cursor: grab;
      touch-action: none;
    }
    .sheet-drag-pill {
      width: 44px;
      height: 5px;
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      margin: 0 auto;
    }
    .sheet-top-actions {
      display: flex;
      gap: 8px;
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 10;
    }
    .circle-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .circle-icon-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.18); }
    .circle-icon-btn:active { transform: scale(0.9); }

    .modal-header { display: flex; gap: 14px; padding-right: 74px; }
    .modal-poster {
      width: 76px;
      aspect-ratio: 2/3;
      border-radius: 12px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
    .modal-titles { flex: 1; }
    .modal-titles h2 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .modal-titles p { font-size: 12px; color: var(--text-muted); line-height: 1.35; }

    /* Переключатель режима: Смотреть онлайн / Скачать в ТГК */
    .mode-switch {
      display: flex;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s var(--spring);
    }
    .mode-btn.active {
      background: rgba(0, 210, 255, 0.16);
      color: var(--accent);
      border: 1px solid rgba(0, 210, 255, 0.35);
    }

    /* === ВИДЕОПЛЕЕР И ЕДИНЫЙ НИЖНИЙ CONTROL BAR === */
    .player-section { display: none; flex-direction: column; gap: 10px; }
    .player-section.active { display: flex; }

    .player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .player-wrap iframe, .player-wrap video, .player-wrap #kinobox-container {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Нижний Control Bar для удобного выбора Озвучки, Серии и Плеера */
    .unified-control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 14px;
      position: relative;
    }
    .ctrl-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s var(--spring), border-color 0.2s;
      flex: 1;
      min-width: 135px;
      justify-content: space-between;
    }
    .ctrl-pill:hover { border-color: var(--accent); transform: translateY(-1px); }
    .ctrl-pill span.val { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

    /* Всплывающее меню поверх (Popover) для выбора озвучки или плеера */
    .popover-menu {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: #0e1628;
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 14px;
      padding: 10px;
      max-height: 210px;
      overflow-y: auto;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      animation: switchPop 0.2s var(--spring);
    }
    .popover-menu.open { display: flex; }
    .pop-option {
      background: rgba(255,255,255,0.04);
      border: 1px solid transparent;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }
    .pop-option:hover { background: rgba(255,255,255,0.09); }
    .pop-option.selected {
      background: rgba(0, 210, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
    }
    .pop-badge {
      font-size: 10.5px;
      background: rgba(0,0,0,0.5);
      padding: 2px 7px;
      border-radius: 6px;
      color: #fbbf24;
    }

    /* Блок выбора сезонов и серий */
    .serial-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 14px;
    }
    .serial-box.active { display: flex; }
    .season-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .season-chips::-webkit-scrollbar { display: none; }
    .s-chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .s-chip.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .dl-scope-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .scope-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .scope-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0, 210, 255, 0.14); }

    .ep-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      max-height: 110px;
      overflow-y: auto;
    }
    .ep-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .ep-chip.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }

    .select-wrap { display: flex; gap: 8px; }
    select {
      flex: 1;
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
    }

    .action-btn {
      background: linear-gradient(135deg, #00d2ff, #0284c7);
      color: #000;
      font-weight: 900;
      font-size: 14px;
      border: none;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
      box-shadow: 0 8px 22px rgba(0, 210, 255, 0.3);
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 210, 255, 0.45); }
    .action-btn:active { transform: scale(0.97); }

    /* Карточки задач */
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .task-title { font-size: 13px; font-weight: 800; }
    .mini-ctrl {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 7px;
      cursor: pointer;
    }
    .task-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .task-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.35s; }
  </style>
</head>
<body>

  <!-- ВЕРХНИЙ СТАТУС-БАР CLEANYOURTV OS -->
  <header class="tv-topbar">
    <div class="os-brand">
      <div class="os-logo">CleanYourTV</div>
      <span class="os-title">OS 5.0</span>
      <span class="conn-dot" id="srv-dot" title="Статус связи с ПК"></span>
    </div>
    <div class="os-status-right">
      <button class="os-pill" id="sound-toggle-btn" title="Звуковые эффекты Nintendo Switch">🔊 Звук</button>
      <button class="os-pill" id="toggle-settings-btn">⚙️ Система</button>
      <span class="os-clock" id="os-clock">00:00</span>
    </div>
  </header>

  <!-- Выдвижная панель настроек -->
  <div class="settings-drawer" id="settings-drawer">
    <div class="settings-row">

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const DEFAULT_KP_KEY = "499be78a-5444-4620-b192-b8888fcb7143";
    const KODIK_PUBLIC_TOKEN = "0494164a3e824c4b4a68393cb5622014";
    const CLOUD_BOT_TOKEN = "9127267176:AAHPmwAUw5H_dQPiCsZqLoRisA_-pGnw6as";
    const CLOUD_CHANNEL_ID = "-1004332808314";

    let serverUrl = localStorage.getItem('vg_srv_url') || 'http://127.0.0.1:8765';
    let kpApiKey = localStorage.getItem('vg_kp_key') || DEFAULT_KP_KEY;
    let userTgId = localStorage.getItem('vg_tg_uid') || (tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '');
    let soundEnabled = localStorage.getItem('vg_sfx') !== 'off';

    let watchlist = JSON.parse(localStorage.getItem('vg_watchlist') || '[]');
    let watched = JSON.parse(localStorage.getItem('vg_watched') || '[]');
    let tasteHistory = JSON.parse(localStorage.getItem('vg_taste_v3') || '[]');
    let localTasks = JSON.parse(localStorage.getItem('vg_tasks_v3') || '[]');

    // Быстрый кэш в оперативной памяти
    const memorySourcesCache = new Map();

    let selectedMovie = null;
    let unifiedVoiceGroups = [];
    let currentVoiceGroup = null;
    let currentPlayerSource = null;
    let currentSeasonKey = '1';
    let selectedDownloadScope = 'selected';
    let selectedEpisodesSet = new Set(['1']);
    let isWatchOnlineMode = false;
    let serverReachable = false;
    let hlsInstance = null;
    let focusedCardIdx = -1;

    document.getElementById('srv-url-input').value = serverUrl;
    document.getElementById('kp-key-input').value = kpApiKey;
    document.getElementById('tg-uid-input').value = userTgId;

    // === 1. ЗВУКОВОЙ ДВИЖОК NINTENDO SWITCH (Web Audio API без внешних файлов) ===
    let audioCtx = null;
    function playSwitchSound(type = 'tick') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tick') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.025);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.start(now);
          osc.stop(now + 0.032);
        } else if (type === 'pop') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(1040, now + 0.055);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.065);
        }
      } catch (e) {}
    }

    function updateSoundBtnUI() {
      const btn = document.getElementById('sound-toggle-btn');
      btn.textContent = soundEnabled ? '🔊 Звук' : '🔇 Без звука';
      btn.style.opacity = soundEnabled ? '1' : '0.6';
    }
    updateSoundBtnUI();

    document.getElementById('sound-toggle-btn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('vg_sfx', soundEnabled ? 'on' : 'off');
      updateSoundBtnUI();
      if (soundEnabled) playSwitchSound('pop');
    });

    // Часы в верхнем баре CleanYourTV OS
    function updateClock() {
      document.getElementById('os-clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 10000);
    updateClock();

    // === 2. НОРМАЛИЗАТОР ОЗВУЧЕК И ЗЕРКАЛ ===
    const VOICE_SYNONYM_MAP = [
      { canon: "🎬 Дубляж (Официальный)", keys: ["дубляж", "дублирован", "мосфильм", "пифагор", "лицензия", "red head sound", "rhs", "снг", "dub"] },
      { canon: "🎙 HDRezka Studio", keys: ["hdrezka", "rezka", "резка"] },
      { canon: "🎙 Кубик в Кубе", keys: ["кубик в кубе", "кубик", "kubik"] },
      { canon: "🎙 LostFilm", keys: ["lostfilm", "лостфильм", "лостфилм"] },
      { canon: "🎙 TVShows", keys: ["tvshows", "твшоус"] },
      { canon: "🎙 Jaskier (Яскьер)", keys: ["jaskier", "яскьер"] },
      { canon: "🎙 АниЛибрия", keys: ["anilibria", "анилибрия"] },
      { canon: "🎙 Студийная Банда", keys: ["студийная банда", "studio band"] },
      { canon: "🎙 Авторский (Гоблин)", keys: ["гоблин", "пучков", "гаврилов", "авторский"] },
      { canon: "🎙 Многоголосый (MVO)", keys: ["многоголос", "мво", "mvo", "профессиональн"] },
      { canon: "🇬🇧 Оригинал (Eng + Sub)", keys: ["оригинал", "original", "eng", "субтитр", "sub"] }
    ];

    function normalizeVoiceTitle(raw) {
      if (!raw) return "🎬 Дубляж (Официальный)";
      const low = raw.toLowerCase().trim();
      for (const r of VOICE_SYNONYM_MAP) {
        if (r.keys.some(k => low.includes(k))) return r.canon;
      }
      const clean = raw.replace(/\[.*?\]|\(.*?\)/g, '').trim();
      return clean ? `🎙 ${clean}` : "🎬 Дубляж (Официальный)";
    }

    function fixMirrorDomain(url) {
      if (!url) return '';
      if (url.startsWith('//')) url = 'https:' + url;
      return url.replace('kodik.info', 'kodik.biz').replace('aniqit.com', 'kodik.biz');
    }

    function getQualityScore(qStr) {
      const s = String(qStr || '').toLowerCase();
      if (s.includes('2160') || s.includes('4k')) return 2160;
      if (s.includes('1080') || s.includes('fhd') || s.includes('bd')) return 1080;
      return 720;
    }

    // === 3. НАВИГАЦИЯ DOCK И КЛАВИАТУРА/ГЕЙМПАД НА ПК ===
    document.querySelectorAll('.dock-item').forEach(btn => {
      btn.addEventListener('click', () => {
        playSwitchSound('pop');
        document.querySelectorAll('.dock-item, .tab-pane').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.pane).classList.add('active');
        focusedCardIdx = -1;
        if (btn.dataset.pane === 'pane-recs') renderSmartRecommendations();
        if (btn.dataset.pane === 'pane-lists') renderSavedLists();
        if (btn.dataset.pane === 'pane-tracker') checkServerOnce();
      });
    });

    document.addEventListener('keydown', (e) => {
      const modalOpen = document.getElementById('modal').style.display === 'flex';
      if (e.key === 'Escape' && modalOpen) {
        closeModalWindow();
        return;
      }
      if (modalOpen || document.activeElement.tagName === 'INPUT') return;

      const activeGrid = document.querySelector('.tab-pane.active .grid');
      if (!activeGrid) return;
      const cards = Array.from(activeGrid.querySelectorAll('.movie-card'));
      if (!cards.length) return;

      const cols = window.innerWidth >= 980 ? 5 : (window.innerWidth >= 640 ? 4 : 2);
      if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
        e.preventDefault();
        playSwitchSound('tick');
        if (focusedCardIdx < 0) focusedCardIdx = 0;
        else if (e.key === 'ArrowRight') focusedCardIdx = Math.min(cards.length - 1, focusedCardIdx + 1);
        else if (e.key === 'ArrowLeft') focusedCardIdx = Math.max(0, focusedCardIdx - 1);
        else if (e.key === 'ArrowDown') focusedCardIdx = Math.min(cards.length - 1, focusedCardIdx + cols);
        else if (e.key === 'ArrowUp') focusedCardIdx = Math.max(0, focusedCardIdx - cols);

        cards.forEach(c => c.classList.remove('tv-focused'));
        const target = cards[focusedCardIdx];
        if (target) {
          target.classList.add('tv-focused');
          target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      } else if (e.key === 'Enter' && focusedCardIdx >= 0 && cards[focusedCardIdx]) {
        e.preventDefault();
        cards[focusedCardIdx].click();
      }
    });

    document.getElementById('toggle-settings-btn').addEventListener('click', () => {
      playSwitchSound('tick');
      document.getElementById('settings-drawer').classList.toggle('open');
    });

    document.getElementById('save-settings-btn').addEventListener('click', () => {
      playSwitchSound('pop');
      serverUrl = document.getElementById('srv-url-input').value.trim().replace(/\/$/, '') || 'http://127.0.0.1:8765';
      kpApiKey = document.getElementById('kp-key-input').value.trim() || DEFAULT_KP_KEY;
      userTgId = document.getElementById('tg-uid-input').value.trim();
      localStorage.setItem('vg_srv_url', serverUrl);
      localStorage.setItem('vg_kp_key', kpApiKey);
      localStorage.setItem('vg_tg_uid', userTgId);
      document.getElementById('settings-drawer').classList.remove('open');
      checkServerOnce();
    });

    // === 4. СВЕРХБЫСТРЫЙ ПАРАЛЛЕЛЬНЫЙ ПОИСК ОЗВУЧЕК И ПЛЕЕРОВ ===
    async function fetchAllBalancerSourcesFast(m) {
      const cacheKey = `${m.kp_id || ''}_${m.imdb_id || ''}_${m.title}_${m.year}`.toLowerCase();
      if (memorySourcesCache.has(cacheKey)) {
        return memorySourcesCache.get(cacheKey);
      }

      const rawSources = [];
      const cleanTitle = m.title.replace(/\(\d{4}\)/g, '').replace(/[:\-–]/g, ' ').trim();

      // 1. Всегда мгновенно формируем гарантированные рабочие веб-плееры (чтобы не было черного экрана на смартфонах!)
      if (m.kp_id && /^\d+$/.test(m.kp_id)) {
        rawSources.push({
          balancer: 'MultiPlayer HD (Моб/ПК)',
          voice_canonical: '🎬 Дубляж (Официальный)',
          voice_raw: 'Мульти-агрегатор 1080p',
          quality: '1080p',
          quality_rank: 1080,
          iframe_url: `https://ddbb.lol/?kp=${m.kp_id}`,
          is_serial: false,
          seasons: {}
        });
      }
      if (m.imdb_id && m.imdb_id.startsWith('tt')) {
        rawSources.push({
          balancer: 'VidSrc 1080p (Global)',
          voice_canonical: '🇬🇧 Оригинал (Eng + Sub)',
          voice_raw: 'English 1080p',
          quality: '1080p',
          quality_rank: 1080,
          iframe_url: `https://vidsrc.xyz/embed/movie/${m.imdb_id}`,
          is_serial: false,
          seasons: {}
        });
      }

      // 2. Если сервер ПК онлайн — берем данные с него за 1 запрос
      if (serverReachable) {
        try {
          const params = new URLSearchParams({
            title: cleanTitle,
            orig_title: m.orig_title || '',
            year: m.year || '',
            kp_id: m.kp_id || '',
            imdb_id: m.imdb_id || ''
          });
          const srvRes = await fetch(`${serverUrl}/api/sources?${params.toString()}`, { signal: AbortSignal.timeout(2200) });
          if (srvRes.ok) {
            const srvData = await srvRes.json();
            if (srvData.results && srvData.results.length > 0) {
              const merged = [...srvData.results, ...rawSources];
              memorySourcesCache.set(cacheKey, merged);
              return merged;
            }
          }
        } catch (e) {}
      }

      // 3. Параллельная гонка запросов (Promise.allSettled) с коротким таймаутом 2.0 сек
      const fastJsonFetch = async (url) => {
        try {
          const r = await fetch(url, { signal: AbortSignal.timeout(1900) });
          if (r.ok) return await r.json();
        } catch (e) {}
        try {
          const pr = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(2400) });
          if (pr.ok) return await pr.json();
        } catch (e) {}
        return null;
      };

      const kodikUrl = (m.kp_id && /^\d+$/.test(m.kp_id))
        ? `https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&kinopoisk_id=${m.kp_id}&with_episodes=true`
        : `https://kodikapi.com/search?token=${KODIK_PUBLIC_TOKEN}&title=${encodeURIComponent(cleanTitle)}&with_episodes=true`;

      const kbUrl = (m.kp_id && /^\d+$/.test(m.kp_id))
        ? `https://api.kinobox.tv/api/players?kinopoisk=${m.kp_id}`
        : null;

      const [kodikSettled, kbSettled] = await Promise.allSettled([
        fastJsonFetch(kodikUrl),
        kbUrl ? fastJsonFetch(kbUrl) : Promise.resolve(null)
      ]);

      const kodikData = kodikSettled.status === 'fulfilled' ? kodikSettled.value : null;
      if (kodikData && Array.isArray(kodikData.results)) {
        kodikData.results.forEach(item => {
          const rawV = item.translation?.title || 'Дубляж';
          const qScore = getQualityScore(item.quality || '1080p');
          const cleanSeasons = {};
          if (item.seasons) {
            Object.entries(item.seasons).forEach(([sK, sV]) => {
              const epMap = {};
              Object.entries(sV.episodes || {}).forEach(([eK, eV]) => {
                const lnk = typeof eV === 'string' ? eV : (eV.link || '');
                epMap[eK] = fixMirrorDomain(lnk);
              });
              cleanSeasons[sK] = { episodes: epMap };
            });
          }
          rawSources.push({
            balancer: 'Kodik (.biz зеркало)',
            voice_canonical: normalizeVoiceTitle(rawV),
            voice_raw: rawV,
            quality: qScore >= 1080 ? '1080p' : `${qScore}p`,
            quality_rank: qScore,
            iframe_url: fixMirrorDomain(item.link || ''),
            is_serial: Boolean(item.seasons),
            seasons: cleanSeasons
          });
        });
      }

      const kbData = kbSettled.status === 'fulfilled' ? kbSettled.value : null;
      const kbPlayers = Array.isArray(kbData) ? kbData : (kbData?.data || []);
      kbPlayers.forEach(p => {
        const bName = (p.type || p.source || 'Alloha').toUpperCase();
        const iframe = fixMirrorDomain(p.iframeUrl || p.url || '');
        if (!iframe || bName === 'KODIK') return;
        const trList = p.translations || [{ name: 'Дубляж', quality: '1080p' }];
        trList.forEach(tr => {
          const rV = tr.name || tr.title || 'Дубляж';
          const qS = getQualityScore(tr.quality || p.quality || '1080p');
          rawSources.push({
            balancer: bName,
            voice_canonical: normalizeVoiceTitle(rV),
            voice_raw: rV,
            quality: qS >= 1080 ? '1080p' : `${qS}p`,
            quality_rank: qS,
            iframe_url: iframe,
            is_serial: false,
            seasons: {}
          });
        });
      });

      rawSources.sort((a, b) => b.quality_rank - a.quality_rank);
      memorySourcesCache.set(cacheKey, rawSources);
      return rawSources;
    }

    function groupAndRankVoices(sources) {
      const map = new Map();
      sources.forEach(src => {
        const key = src.voice_canonical;
        if (!map.has(key)) {
          map.set(key, {
            canonical: key,
            bestQuality: src.quality,
            bestRank: src.quality_rank,
            balancers: [src.balancer],
            primarySource: src,
            allSources: [src]
          });
        } else {
          const grp = map.get(key);
          grp.allSources.push(src);
          if (!grp.balancers.includes(src.balancer)) grp.balancers.push(src.balancer);
          if (src.is_serial && !grp.primarySource.is_serial) {
            grp.primarySource = src;
          }
        }
      });
      return Array.from(map.values()).sort((a, b) => b.bestRank - a.bestRank);
    }

            ifr.style.display = 'none';
            vid.style.display = 'block';
            if (Hls.isSupported()) {
              hlsInstance = new Hls();
              hlsInstance.loadSource(fullProxyUrl);
              hlsInstance.attachMedia(vid);
              hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
              vid.src = fullProxyUrl;
              vid.play().catch(() => {});
            }
            return;
          }
        }
      } catch (e) {}
      launchIframePlayer(sourceObj);
    }

    // === 8. КАТАЛОГ, ПОСТЕРЫ И УМНЫЕ РЕКОМЕНДАЦИИ ===
    function isBadPosterUrl(url) {
      if (!url || typeof url !== 'string') return true;
      const low = url.toLowerCase();
      return low.includes('no-poster') || low.includes('noposter') || low.includes('empty') || low.includes('placeholder');
    }

    async function resolveMissingPoster(title, origTitle, year, imgEl) {
      for (const qText of [origTitle, title].filter(Boolean)) {
        try {
          const q = `${qText} ${year || ''}`.trim();
          const res = await fetch(`https://imdb.iamidiotareyoutoo.com/search?q=${encodeURIComponent(q)}`);
          if (res.ok) {
            const data = await res.json();
            const found = (data.description || []).find(item => item['#IMG_POSTER'] && !isBadPosterUrl(item['#IMG_POSTER']));
            if (found) {
              imgEl.src = found['#IMG_POSTER'];
              return found['#IMG_POSTER'];
            }
          }
        } catch (e) {}
      }
      return null;
    }

    async function fetchMoviesByQuery(query) {
      const results = [];
      const seen = new Set();

      if (kpApiKey) {
        try {
          const url = query
            ? `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}`
            : `https://kinopoiskapiunofficial.tech/api/v2.2/films/collections?type=TOP_POPULAR_ALL&page=1`;
          const res = await fetch(url, { headers: { 'X-API-KEY': kpApiKey, 'Content-Type': 'application/json' } });
          if (res.ok) {
            const data = await res.json();
            (data.films || data.items || []).forEach(f => {
              const title = f.nameRu || f.nameEn || f.nameOriginal || '';
              if (!title) return;
              const year = String(f.year || '');
              const key = `${title}_${year}`.toLowerCase();
              if (seen.has(key)) return;
              seen.add(key);

              const rawPoster = f.posterUrlPreview || f.posterUrl || '';
              const genres = (f.genres || []).map(g => g.genre).slice(0, 2);
              results.push({
                id: String(f.filmId || f.kinopoiskId || ''),
                kp_id: String(f.filmId || f.kinopoiskId || ''),
                imdb_id: String(f.imdbId || ''),
                title: title,
                orig_title: f.nameEn || f.nameOriginal || title,
                year: year,
                poster: isBadPosterUrl(rawPoster) ? '' : rawPoster,
                rating: (f.rating && f.rating !== 'null') ? f.rating : (f.ratingKinopoisk || 'HD'),
                genres: genres,
                director: genres.join(', ') || 'Кино и сериалы',
                overview: f.description || ''
              });
            });
          }
        } catch (e) {}
      }
      return results;
    }

    function renderMoviesToGrid(movies, targetEl) {
      targetEl.innerHTML = '';

        card.className = 'movie-card';
        const fallbackSvg = `https://placehold.co/300x450/11192c/00d2ff?text=${encodeURIComponent(m.title.slice(0, 16))}`;
        const validPoster = (!isBadPosterUrl(m.poster)) ? m.poster : '';

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${validPoster || fallbackSvg}" loading="lazy" alt="${m.title}">

            <span class="card-meta">${m.year ? m.year + ' г.' : 'Тайтл'}</span>
          </div>
        `;

        const imgEl = card.querySelector('img');
        if (!validPoster) {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => { if (u) m.poster = u; });

        imgEl.addEventListener('error', () => {
          resolveMissingPoster(m.title, m.orig_title, m.year, imgEl).then(u => {

    async function checkServerOnce() {

      const isHttpsRemote = location.protocol === 'https:' && serverUrl.startsWith('http://127.0.0.1');

        dot.classList.remove('online');
        renderTrackerOffline();

      try {
        const res = await fetch(`${serverUrl}/api/status`, { signal: AbortSignal.timeout(1800) });
        if (res.ok) {
          const data = await res.json();
          serverReachable = true;
          dot.classList.add('online');
          renderTrackerFromServer(data.tasks || {}, data.history || []);

        dot.classList.remove('online');

            <div class="task-top">
              <span class="task-title">${h.title} (${h.quality})</span>
              <span style="font-size:11px; color:var(--green);">${h.size}</span>
            </div>
            ${h.post_url ? `<a href="${h.post_url}" target="_blank" style="font-size:11.5px; color:var(--accent);">🍿 Открыть в закрытом ТГК</a>` : ''}
          </div>
        `).join('');
      }
      container.innerHTML = html;
    }

    function renderTrackerOffline() {
      const container = document.getElementById('tasks-container');
      if (!localTasks.length) {
        container.innerHTML = `<div class="status-msg">Активен облачный мост Telegram. Живой прогресс-бар отображается прямо в чате бота!</div>`;
        return;
      }
      container.innerHTML = localTasks.map(t => `
        <div class="task-card">
          <div class="task-title">${t.title}</div>
          <div style="font-size:11.5px; color:var(--accent); margin-top:4px;">📡 ${t.stage}</div>
        </div>
      `).join('');
    }

    document.getElementById('clear-tasks-btn').addEventListener('click', () => {
      playSwitchSound('tick');
      localTasks = [];
      localStorage.setItem('vg_tasks_v3', '[]');
      checkServerOnce();
    });

    // Рекомендации и списки
    function extractFranchiseRoot(title) {
      return title.replace(/\(\d{4}\)/g, '').split(/[:—\-–.|]/)[0].replace(/\b(\d+|I|II|III|IV|V|Часть|Сезон|Фильм)\b.*$/i, '').trim();
    }

    function recordUserInterest(movie, weight = 1) {
      if (!movie || !movie.title) return;
      const root = extractFranchiseRoot(movie.title);
      const existing = tasteHistory.find(x => x.root.toLowerCase() === root.toLowerCase());
      if (existing) {
        existing.score += weight;
        existing.ts = Date.now();
      } else {
        tasteHistory.unshift({ root, genre: (movie.genres && movie.genres[0]) || 'фантастика', score: weight, ts: Date.now() });
      }
      tasteHistory.sort((a, b) => b.score - a.score || b.ts - a.ts);
      tasteHistory = tasteHistory.slice(0, 12);
      localStorage.setItem('vg_taste_v3', JSON.stringify(tasteHistory));
    }

    async function renderSmartRecommendations() {
      const container = document.getElementById('recs-shelves');
      const label = document.getElementById('taste-profile-label');
      container.innerHTML = `<div class="status-msg">Формируем персональные полки...</div>`;

      const shelves = [];
      if (tasteHistory.length > 0) {
        const top1 = tasteHistory[0];
        label.textContent = `Твой фаворит: «${top1.root}» (${top1.score} балл.)`;
        shelves.push({ title: `🎬 Все части и спин-оффы: «${top1.root}»`, query: top1.root });
        if (tasteHistory[1]) shelves.push({ title: `🔥 Похожее и продолжения: «${tasteHistory[1].root}»`, query: tasteHistory[1].root });
        shelves.push({ title: `✨ Топ в жанре: ${top1.genre}`, query: top1.genre });
      } else {
        shelves.push({ title: `🌌 Вселенная Звёздных войн`, query: `Звёздные войны` }, { title: `🏆 Хиты в 1080p`, query: `Дюна` });
      }

      container.innerHTML = '';
      for (const sh of shelves) {
        const items = await fetchMoviesByQuery(sh.query);
        if (!items.length) continue;
        const block = document.createElement('div');
        block.className = 'shelf-block';
        block.innerHTML = `<div class="shelf-title">${sh.title}</div><div class="shelf-row"></div>`;
        renderMoviesToGrid(items.slice(0, 10), block.querySelector('.shelf-row'));
        container.appendChild(block);
      }
    }

    document.getElementById('reset-taste-btn').addEventListener('click', () => {
      playSwitchSound('tick');
      tasteHistory = [];
      localStorage.setItem('vg_taste_v3', '[]');
      renderSmartRecommendations();
    });

    let currentListMode = 'watchlist';
    function renderSavedLists() {
      document.getElementById('cnt-watch').textContent = watchlist.length;
      document.getElementById('cnt-watched').textContent = watched.length;
      const src = currentListMode === 'watchlist' ? watchlist : watched;
      const grid = document.getElementById('lists-grid');
      const empty = document.getElementById('lists-empty');
      if (!src.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        renderMoviesToGrid(src, grid);
      }
    }

    document.getElementById('btn-show-watchlist').addEventListener('click', () => {
      playSwitchSound('tick');
      currentListMode = 'watchlist';
      renderSavedLists();
    });
    document.getElementById('btn-show-watched').addEventListener('click', () => {
      playSwitchSound('tick');
      currentListMode = 'watched';
      renderSavedLists();
    });

    document.getElementById('m-add-watch').addEventListener('click', () => {
      if (!selectedMovie) return;
      playSwitchSound('pop');
      const i = watchlist.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watchlist.splice(i, 1); else watchlist.unshift(selectedMovie);
      localStorage.setItem('vg_watchlist', JSON.stringify(watchlist));
      renderSavedLists();
    });
    document.getElementById('m-add-watched').addEventListener('click', () => {
      if (!selectedMovie) return;
      playSwitchSound('pop');
      const i = watched.findIndex(x => x.title === selectedMovie.title);
      if (i >= 0) watched.splice(i, 1); else watched.unshift(selectedMovie);
      localStorage.setItem('vg_watched', JSON.stringify(watched));
      renderSavedLists();
    });

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => searchMovies(e.target.value.trim()), 320);
    });

    checkServerOnce();
    searchMovies('');
  </script>
</body>
</html>
